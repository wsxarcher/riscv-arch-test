# sargantana4-rv64gcbh-zimt (Sargantana with Zimt memory tagging, both pointer tag widths, Svatag and
# Smvatag) with V (VLEN 128) and the mcontrol6 triggers of Sdtrig, run on the Sail model itself, for the Zimt
# cases that need S-mode and V or Sdtrig. sail.json is Sargantana's with V and Sdtrig; rvmodel_macros.h and
# link.ld are sail-rv64-max's (HTIF console), with the RAM of Sargantana's sail.json (256 MiB).
name: sail-rv64-gcbhv-zimt
compiler_exe: riscv64-unknown-elf-gcc # executable name on $PATH or full path to executable
objdump_exe: riscv64-unknown-elf-objdump # executable name on $PATH or full path to executable, optional
ref_model_exe: sail_riscv_sim # executable name on $PATH or full path to executable
udb_config: sail-rv64-gcbhv-zimt.yaml
linker_script: link.ld
dut_include_dir: . # Directory containing DUT specific rvmodel_macros.h header
# Implemented, but not defined by UDB: listed here instead of in the UDB config (Svatag depends on Svukte, which the
# UDB config implements)
experimental_extensions: [Zimt, Svatag, Smvatag]
experimental_params:
  ZIMT_POINTER_TAG_WIDTH_7: true # as in sail.json
  SMVATAG_NO_M_MODE_VITT_RANGE: true # as in the Sail model
  SVATAG_NO_BARE_VITT_RANGE: true # as in the Sail model
