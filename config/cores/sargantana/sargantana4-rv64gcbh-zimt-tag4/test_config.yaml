# sargantana4-rv64gcbh-zimt with a core that supports only 4-bit Zimt pointer tags: core_tile built with
# DISABLE_ZIMT_TAG7 (sim_flags.txt), which run-riscv-arch-test.sh builds as a simulator of its own.
# The UDB config, linker script, runner, rvmodel_macros.h and known failures are those of sargantana4-rv64gcbh-zimt.
name: sargantana4-rv64gcbh-zimt-tag4
compiler_exe: riscv64-unknown-elf-gcc # executable name on $PATH or full path to executable
objdump_exe: riscv64-unknown-elf-objdump # executable name on $PATH or full path to executable, optional
ref_model_exe: sail_riscv_sim # executable name on $PATH or full path to executable
udb_config: ../sargantana4-rv64gcbh-zimt/sargantana4-rv64gcbh-zimt.yaml
linker_script: ../sargantana4-rv64gcbh-zimt/link.ld
dut_include_dir: . # Directory containing DUT specific rvmodel_macros.h header
# Implemented, but not defined by UDB: listed here instead of in the UDB config
experimental_extensions: [Zimt, Svatag, Smvatag]
experimental_params:
  ZIMT_POINTER_TAG_WIDTH_7: false # no 7-bit pointer tags, as in sail.json
