# yaml-language-server: $schema=testplan.schema.json
suite: Svatag
source: https://github.com/riscv/riscv-memory-tagging/blob/main/modules/ROOT/pages/mte_vatag.adoc
notes: |
  covergroups Svatag_S_cg and Svatag_H_cg
  Svatag defines the virtually indexed tag table (VITT) base CSRs svitts (S/HS-mode), svittu (U-mode), vsvitts (VS-mode) and vsvittu (VU-mode). Their addresses are the Sail model's placeholders (rvtest_experimental.h).
  Svatag_S boots to S-mode and also runs in U-mode. Svatag_H boots to HS-mode and also runs in VS-mode and VU-mode.
  A base must be 4 KiB aligned. Aligned bases are canonical Sv39 addresses, which every address width holds.
coverpoints:
  - name: cp_vitt_warl
    goal: A tag table base is 4 KiB aligned
    description: |-
      Write aligned bases and read them back: svitts and svittu in S-mode (Svatag_S), vsvitts and vsvittu in HS-mode (Svatag_H).
      Write bases that are not aligned, whose legalization is implementation-defined, and record whether bits 11:0 read 0.
    expectation: An aligned base reads back as written. After a base that is not aligned, 1.
    bins: S 2 CSRs x 2 (aligned, not aligned), HS 2 x 2
  - name: cp_vitt_vs_redirect
    goal: In VS-mode, svitts and svittu access vsvitts and vsvittu
    description: |-
      In HS-mode, write different bases to the four CSRs. In VS-mode, write a new base to svitts with csrrw, read svitts and vsvitts with T-SBI calls, which access them from HS-mode, and then read svitts; the same for svittu.
      The bins need svitts or svittu and its VS-level copy to hold different bases before the access, so that its result shows which one it reached.
    expectation: VS-mode replaces and reads the bases of vsvitts and vsvittu; svitts and svittu keep theirs.
    bins: 2 (read, write) x 2 CSRs
  - name: cp_vitt_access
    goal: The tag table base CSRs follow the CSR privilege rules
    description: |-
      In U, VS and VU modes, read each of the four CSRs (vsvitts and vsvittu need H), write it with csrrw, and read it again.
      T-SBI calls, which access the CSRs from HS-mode, write a base to each CSR first and read it after the write: a write that raised an exception leaves that base, and so does a VS-mode write to svitts or svittu, which reaches vsvitts or vsvittu.
    expectation: |-
      U-mode: every access raises an illegal-instruction exception.
      VS-mode: svitts and svittu are accessible (as vsvitts and vsvittu); vsvitts and vsvittu raise a virtual-instruction exception.
      VU-mode: every access raises a virtual-instruction exception.
      Each T-SBI read after a write returns the base written first.
    bins: U, VS, VU x 2 (read, write) x 4 CSRs
