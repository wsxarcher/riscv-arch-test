# yaml-language-server: $schema=testplan.schema.json
suite: Zimt
source: https://github.com/riscv/riscv-memory-tagging/blob/main/modules/ROOT/pages/mte_tag.adoc
notes: |
  covergroups Zimt_Sm_cg, Zimt_S_cg, Zimt_U_cg and Zimt_H_cg
  Zimt_Sm boots to M-mode, Zimt_S to S-mode and Zimt_U to U-mode. Zimt_H boots to HS-mode and runs its tests in VS-mode and VU-mode.
  Each group has five tests: <group> with memory tagging disabled, <group>_csr for the CSRs, <group>_mt for gentag and addtag with memory tagging enabled, <group>_settag for settag with memory tagging enabled, and <group>_checktag for checktag and the implicit tag checks of loads and stores with memory tagging enabled. Zimt_U_mt, Zimt_U_settag and Zimt_U_checktag need S-mode, where senvcfg, senvmtagexclude and svittu are. Zimt_Sm_stateen (S-mode and Smstateen) tests mstateen0.MT and hstateen0.MT, and Zimt_Sm_trigger (S-mode, Smnpm, Svatag and Sdtrig) the triggers of the accesses that are tag checked.
  The settag and checktag tests need the tag table CSR and pointer masking of their modes, which ignores the pointer tags in the address: Zimt_Sm_settag and Zimt_Sm_checktag Smvatag (mvitt) and Smmpm, Zimt_S_settag and Zimt_S_checktag Svatag (svitts), Smnpm and Sv39, Zimt_U_settag and Zimt_U_checktag Svatag (svittu) and Ssnpm, Zimt_H_settag and Zimt_H_checktag Svatag (vsvitts, vsvittu) and Ssnpm. They use PMLEN 7 if supported, else 16. The M-mode MPRV cases of Zimt_Sm_settag and Zimt_Sm_checktag also need S-mode, Smnpm and Svatag, and the guest translation cases of Zimt_H_settag and Zimt_H_checktag Sv39.
  Store/AMO access faults come from RVMODEL_ACCESS_FAULT_ADDRESS_STORE (which defaults to RVMODEL_ACCESS_FAULT_ADDRESS), and load access faults and a page-table walk that faults from RVMODEL_ACCESS_FAULT_ADDRESS_LOAD: the cases and bins that need them exist only if the DUT defines them. The tags of those cases start 3 bytes into the faulting region, which is at least 128 bytes.
  Memory tagging is disabled when xMT_MODE = 00, the reset value: mseccfg.MT_MODE (M), menvcfg.MT_MODE (S), henvcfg.MT_MODE (VS) or senvcfg.MT_MODE (U, VU). It is enabled with 4-bit tags (bits 63:60) by 10 and with 7-bit tags (bits 63:57) by 11.
  4-bit tags are mandatory and 7-bit tags optional. A configuration that supports 7-bit tags sets ZIMT_POINTER_TAG_WIDTH_7 in the experimental_params of test_config.yaml, which defines UDB_ZIMT_POINTER_TAG_WIDTH_7: the cases and bins that need 7-bit tags exist only then. Without 7-bit tags, MT_MODE = 11 is reserved, and the exclusion mask bits of the tags 16-127 may be hardwired to zero, so a read of 0 there counts as the value written.
  The exclusion mask CSRs are named mmtagexclude (M), menvmtagexclude (S/HS), henvmtagexclude (VS) and senvmtagexclude (U, VU), with the tags 0-63 in the low CSR (0) and 64-127 in the high one (1). Their addresses are the Sail model's placeholders (rvtest_experimental.h).
  With Smstateen, mstateen0.MT = 0 makes the S-level and H-level CSRs of Zimt and Svatag (senvmtagexclude, svitts and svittu; henvmtagexclude, vsvitts and vsvittu) raise an illegal instruction exception below M-mode, and with Ssstateen, hstateen0.MT = 0 makes the S-level ones raise a virtual instruction exception in VS-mode. The position of the MT bit is not allocated yet: the tests use bit 53, the placeholder of the Sail model (MSTATEEN0_MT and HSTATEEN0_MT, rvtest_experimental.h). The boot code sets both MT bits with Zimt, as it sets the bits of the other state, so that the other tests access the CSRs from the lower modes.
  With memory tagging enabled and Bare first-stage address translation in the effective privilege mode (MPRV applies, unless mstatus.MTAG_I = 1), a hart with tag tables (Svatag, Smvatag) checks the tags of the scalar loads and stores of data (integer, floating-point and compressed ones; not LR/SC, AMOs, CMOs or vector ones) that do not use sp (x2) as the base register: a mismatch raises a software-check exception, xtval = 4, before the access, and a fault of a tag load a load access fault at the tag. HLV and HSV are checked with the memory tagging of their guest mode (VS-mode, or VU-mode: senvcfg.MT_MODE in HS-mode, hstatus.VUMT_MODE in HU-mode), unless hstatus.MTAG_I = 1, and HLVX never. With first-stage address translation, only the pages whose leaf PTE has PTE.MTAG and X = 0 are tagged-data pages, whose loads and stores are checked, and a supervisor access does not check user pages; the loads and stores of the instructions of a tagcheck-exempt code page (PTE.MTAG and X = 1) are not checked. PTE.MTAG is not allocated yet: the tests use bit 58, the placeholder of the Sail model (PTE_MTAG, rvtest_experimental.h). So the tests enable memory tagging only around code whose other loads and stores, such as the signature's, use sp, and trap handlers run in modes where memory tagging stays disabled or with translation, whose pages have no PTE.MTAG. The M-mode trap handler runs with M-mode's memory tagging, so the checktag tests raise no exception with memory tagging enabled in M-mode.
  A trap that writes a nonzero mtinst or htinst deposits the MTAG bit of the code page of the trapping instruction in mstatus.MTAG_I or hstatus.MTAG_I. Whether most traps write one is implementation-defined (transformed instructions), so the tests take no such trap while they use MTAG_I or a tagcheck-exempt code page, except a guest-page fault in an implicit access of a VS-stage walk, whose htinst must hold a pseudoinstruction (cp_mtag_i_deposit).
  With 8-bit memory tags (7-bit pointer tags) the tag of chunk c is the byte at xVITT + c; with 4-bit tags it is the lower (c even) or upper (c odd) half of the byte at xVITT + c / 2, so settag reads, modifies and writes the bytes it shares with other chunks. Before each settag, a pattern whose bytes and halves differ from the tag surrounds the tags.
  settag never raises a misaligned exception in these tests, as in the Sail model. The specification says both that tag accesses "must not raise misaligned exception" (mte_tag.adoc, introduction) and that "If implementation doesn't support misaligned accesses, settag instruction can raise misaligned exception" (settag exceptions). Whether a settag that faults stores the tags before the fault is implementation-defined, since settag may split its tag store into parts with no ordering among them: those tags hold the settag tag already.
  The implicit tag check tests use a data page whose chunks have their tags in the tag table, through the tag table base of the mode. A misaligned load or store, which a hart may perform in parts, checks the tags of all the chunks it overlaps before any part of it.
  With memory tagging enabled and first-stage address translation in the effective privilege mode, Svatag protects the tag storage of that mode: a regular access (a load or store of data, LR/SC, AMO, cbo.zero or vector one, checked or not) whose bytes span its VITT range, the virtual addresses mc_tag_va gives the tags of the virtual addresses of the mode, raises the access fault of its kind, after its page faults and its tag check, and so does a settag (store/AMO access fault) whose chunks overlap it. The VITT range of S-mode and VS-mode holds the tags of the upper half of the address space: with Sv39 it starts at xVITT + ((2^64 - 2^38) >> 5) with 4-bit tags and xVITT + ((2^64 - 2^38) >> 4) with 7-bit ones, modulo 2^64; that of U-mode and VU-mode, the lower half, at xVITT. With Sv39 both are 2^33 bytes with 4-bit tags and 2^34 with 7-bit ones. Those of M-mode and of Bare translation are implementation-defined: the tests whose loads, stores or settags run with memory tagging enabled there take them as empty, so they and the bins that only they cover exist only without Smvatag (M-mode) or Svatag (Bare translation), or if the configuration sets SMVATAG_NO_M_MODE_VITT_RANGE or SVATAG_NO_BARE_VITT_RANGE in the experimental_params of test_config.yaml (UDB_SMVATAG_NO_M_MODE_VITT_RANGE, UDB_SVATAG_NO_BARE_VITT_RANGE): the _mt tests, and the settag and checktag tests of M-mode and of Bare translation, also through MPRV and with the G stage only. The tests put the tag table bases so that these ranges hold no memory that their modes access, through page-table aliases where needed, except in cp_vitt, cp_vitt_mprv_u, cp_vitt_mprv_v, cp_vitt_mtag_i and cp_vitt_hlsv.
  Svatag depends on Svukte and assumes the even split of the address space that Svukte enforces: U-mode and VU-mode use the lower half, the supervisor modes the upper half, which the VITT ranges follow. Svukte qualifies the tag accesses of the loads, stores, checktag and settag of U-mode and VU-mode, also through MPRV and HLV/HSV, as explicit accesses: with senvcfg.UKTE (hstatus.HUKTE for HLV/HSV in HU-mode), one at an address in the upper half raises the page fault of its kind at the tag address, so the tag table of U-mode and VU-mode must be in the lower half. The tests that set UKTE need Svukte, which a configuration that implements Svatag implements too.
  A swept register that the framework uses is saved and restored around the instruction.
coverpoints:
  - heading: Zimt instructions with memory tagging disabled (every group)
  - name: cp_gentag_mt_disabled
    goal: gentag falls back to Zimop
    description: gentag rd (MOP.RR.1, bit 24 = 0, imm4 = 0, rs1 = x0) for each rd != x0, then record rd.
    expectation: rd = 0. No exception.
    bins: 31 rd
  - name: cp_addtag_mt_disabled_imm
    goal: addtag copies rs1 to rd
    description: addtag rd, rs1, imm4 (MOP.RR.1, bit 24 = 0) for each imm4 != 0, with rs1 holding a tagged pointer, then record rd.
    expectation: rd = rs1. No exception. Without Zimt, rd = 0.
    bins: 15 imm4
  - name: cp_addtag_mt_disabled_rd
    goal: addtag copies rs1 to rd
    description: addtag rd, rs1, imm4 for each rd != x0, then record rd.
    expectation: rd = rs1. No exception.
    bins: 31 rd
  - name: cp_addtag_mt_disabled_rs1
    goal: addtag copies rs1 to rd
    description: addtag rd, rs1, imm4 for each rs1, then record rd.
    expectation: rd = rs1, so rd = 0 for rs1 = x0. No exception.
    bins: 32 rs1
  - name: cp_addtag_mt_disabled_rd_rs1
    goal: addtag with rd = rs1
    description: addtag rd, rd, 15, then record rd.
    expectation: rd keeps its value. No exception.
    bins: "1"
  - name: cp_checktag_mt_disabled_imm
    goal: checktag falls back to Zimop
    description: checktag rs1, imm4 (MOP.RR.1, bit 24 = 0, rd = x0, rs1 != x0) for each imm4, with rs1 holding a tagged pointer.
    expectation: No tag load and no exception.
    bins: 16 imm4
  - name: cp_checktag_mt_disabled_rs1
    goal: checktag falls back to Zimop
    description: checktag rs1, imm4 for each rs1 != x0.
    expectation: No tag load and no exception.
    bins: 31 rs1
  - name: cp_settag_mt_disabled_imm
    goal: settag falls back to Zimop
    description: settag rs1, imm4 (MOP.RR.0, bit 24 = 0, rd = x0, rs1 != x0) for each imm4, with rs1 holding a tagged pointer.
    expectation: No tag store and no exception.
    bins: 16 imm4
  - name: cp_settag_mt_disabled_rs1
    goal: settag falls back to Zimop
    description: settag rs1, imm4 for each rs1 != x0.
    expectation: No tag store and no exception.
    bins: 31 rs1
  - heading: MOP.RR encodings that are not Zimt instructions
  - name: cp_mop_rr_not_zimt
    goal: Encodings that miss one condition of a Zimt instruction stay Zimop instructions
    description: |-
      MOP.RR.1 with rd != x0 and bit 24 = 1, for each imm4 (neither gentag nor addtag).
      MOP.RR.1 with rd != x0, rs1 != x0, bit 24 = 0 and imm4 = 0 (neither gentag nor addtag).
      MOP.RR.1 with rd = x0, rs1 != x0 and bit 24 = 1 (not checktag).
      MOP.RR.1 with rd = rs1 = x0 (not checktag).
      MOP.RR.0 with rd != x0 (not settag).
      MOP.RR.0 with rd = x0, rs1 != x0 and bit 24 = 1 (not settag).
      MOP.RR.0 with rd = rs1 = x0 (not settag).
      Record rd when it is not x0. Memory tagging disabled.
    expectation: rd = 0. No exception.
    bins: 16 + 6 = 22 encodings
  - heading: MT_MODE fields
  - name: cp_mt_mode_warl
    goal: MT_MODE is WARL, 01 is reserved, and 11 shows 7-bit tag support
    description: |-
      Write each MT_MODE encoding over 00, 10 and, with 7-bit tags, 11, with one csrw that keeps the other bits, then record MT_MODE (bits 35:34): mseccfg and menvcfg (with U-mode) in M-mode (Zimt_Sm), senvcfg in S-mode (Zimt_S), henvcfg in HS-mode (Zimt_H).
      After writing the reserved 01, or 11 without 7-bit tags, whose legalization is implementation-defined, record whether MT_MODE holds a legal value instead: not 01, and without 7-bit tags not 11 either.
    expectation: MT_MODE reads the value written. After 01, and after 11 without 7-bit tags, 1.
    bins: M 2 CSRs x 3 x 4, S 3 x 4, HS 3 x 4 (2 x 4 instead of 3 x 4 without 7-bit tags)
  - name: cp_vumt_mode_warl
    goal: hstatus.VUMT_MODE is WARL like MT_MODE
    description: In HS-mode, write each VUMT_MODE (hstatus bits 51:50) encoding over 00, 10 and, with 7-bit tags, 11, with one csrw that keeps the other bits, then record it as for MT_MODE.
    expectation: VUMT_MODE reads the value written. After 01, and after 11 without 7-bit tags, 1.
    bins: 3 x 4 (2 x 4 without 7-bit tags)
  - heading: MTAG_I bits
  - name: |-
      cp_mtag_i_write
      cp_mtag_i_view
    goal: mstatus.MTAG_I and hstatus.MTAG_I are writable, and sstatus does not include mstatus.MTAG_I
    description: |-
      In M-mode (Zimt_Sm_csr), set mstatus.MTAG_I (bit 40) with csrs and record it, record bit 40 of sstatus (with S-mode), then clear it with csrc and record it. In HS-mode (Zimt_H_csr), the same with hstatus.MTAG_I (bit 10).
      A trap that writes a nonzero mtinst or htinst deposits the MTAG bit of the code page of the trapping instruction in them; cp_mtag_i_deposit tests it with a pseudoinstruction, as whether other traps write one is implementation-defined.
    expectation: MTAG_I reads 1 after csrs and 0 after csrc. sstatus bit 40 reads 0.
    bins: mstatus 2 (csrrs, csrrc), sstatus 1 (cp_mtag_i_view, with S-mode), hstatus 2
  - heading: Tag generation exclusion mask CSRs
  - name: cp_mtagexclude_reset
    goal: The exclusion mask CSRs reset to 0
    description: In M-mode, read each of the 8 exclusion mask CSRs that exists before any write (menvmtagexclude and senvmtagexclude need S, henvmtagexclude needs H).
    expectation: "0"
    bins: 8 CSRs (2 without S, 6 without H)
  - name: cp_mtagexclude0_warl
    goal: A low exclusion mask CSR must permit one of the tags 0-15
    description: |-
      Write values to the low CSR and record it: mmtagexclude0 and menvmtagexclude0 (with S-mode) in M-mode, senvmtagexclude0 in S-mode, henvmtagexclude0 in HS-mode.
      A value excluding all of the tags 0-15 (bits 15:0 all ones) is illegal, and which bits the CSR then leaves clear is implementation-defined: record whether one of 0-15 is permitted instead.
    expectation: The value written (without 7-bit tags, bits 63:16 may read 0); for an illegal value, 1.
    bins: M 2 CSRs x 2 (legal, all of 0-15 excluded), S 2, HS 2
  - name: cp_mtagexclude1_write
    goal: A high exclusion mask CSR is fully writable with 7-bit tags
    description: Write zero and nonzero values to the high CSR and read them back, as for cp_mtagexclude0_warl.
    expectation: The value written (without 7-bit tags, it may read 0).
    bins: M 2 CSRs x 2 (zero, nonzero), S 2, HS 2
  - name: cp_csr_access
    goal: The exclusion mask CSRs follow the CSR privilege rules
    description: |-
      In S, U, VS and VU modes, read each of the 8 exclusion mask CSRs, write it with csrrw, and read it again.
      T-SBI calls, which access the CSRs from M-mode or HS-mode, write a value to each CSR that exists first and read it after the write: a write that raised an exception leaves that value.
      The values in the low CSRs are below bit 16 and those in the high CSRs 0, which every hart keeps; the high CSRs are written with values above bit 15, which a hart without 7-bit tags may read as 0.
      In VS-mode, senvmtagexclude is the CSR itself: it has no VS-mode copy.
    expectation: |-
      S-mode: mmtagexclude and menvmtagexclude raise an illegal-instruction exception; the others are accessible (henvmtagexclude in HS-mode).
      U-mode: every access raises an illegal-instruction exception.
      VS-mode: senvmtagexclude is accessible; henvmtagexclude raises a virtual-instruction exception; mmtagexclude and menvmtagexclude raise an illegal-instruction exception.
      VU-mode: senvmtagexclude and henvmtagexclude raise a virtual-instruction exception; mmtagexclude and menvmtagexclude raise an illegal-instruction exception.
    bins: S, U, VS, VU x 2 (read, write) x 8 CSRs
  - heading: mstateen0.MT and hstateen0.MT (Zimt_Sm_stateen; needs S-mode and Smstateen. It sets the bits from M-mode, so its bins are in Zimt_Sm_cg; a certification without M-mode (EXCLUDE_SM) does not cover them, and the case of Ssstateen without Smstateen, where hstateen0.MT = 0 alone makes VS-mode raise the virtual instruction exception, is not tested)
  - name: |-
      cp_mstateen0_mt_write
      cp_hstateen0_mt_write
      cp_hstateen0_mt_masked
    goal: mstateen0.MT is writable, and hstateen0.MT is writable while mstateen0.MT = 1 and read-only zero while it is 0, including when mstateen0.MT is cleared while hstateen0.MT = 1
    description: In M-mode, clear and set mstateen0.MT (bit 53, the placeholder position of the Sail model; MSTATEEN0_MT, rvtest_experimental.h) with csrc and csrs, recording the bit after each. With H, clear and set hstateen0.MT; clear mstateen0.MT; set mstateen0.MT again (hstateen0.MT then is not specified, so not recorded) and clear hstateen0.MT; then clear mstateen0.MT and set hstateen0.MT, recording hstateen0.MT after each step but setting mstateen0.MT.
    expectation: mstateen0.MT reads 0, then 1. hstateen0.MT reads 0, 1, 0 (read-only zero once mstateen0.MT is cleared), 0, then 0 (read-only zero while mstateen0.MT = 0).
    bins: mstateen0 2 (set, clear; with csrs and csrc, which the boot code does not use, as it writes the bits with csrw); hstateen0 3 (set, clear, set while mstateen0.MT = 0); masked 1 (the read of hstateen0 after mstateen0.MT is cleared while hstateen0.MT = 1, which reads 0)
  - name: |-
      cp_stateen_mt_m
      cp_stateen_mt_m_level
      cp_stateen_mt_forms
      cp_stateen_mt_s_off
      cp_stateen_mt_s_on
      cp_stateen_mt_u
      cp_stateen_mt_v_off
      cp_stateen_mt_vs_h_off
      cp_stateen_mt_vs_h_on
      cp_stateen_mt_vs_hcsr
      cp_stateen_mt_vu_on
    goal: mstateen0.MT gates the S-level and H-level Zimt and Svatag CSRs below M-mode, and hstateen0.MT the S-level ones in VS-mode
    description: |-
      With mstateen0.MT = 0 (after hstateen0.MT = 1, and for VS-mode and VU-mode also after hstateen0.MT = 0, as a hart that decided on hstateen0.MT alone would raise a virtual instruction exception there), with mstateen0.MT = 1 and hstateen0.MT = 0, and with both 1, for M-mode, S-mode, U-mode and, with H, VS-mode and VU-mode (T-SBI mode changes): in M-mode, write known values to senvmtagexclude0/1, svitts and svittu (S-level; the tag table bases need Svatag) and, with H, henvmtagexclude0/1, vsvitts and vsvittu (H-level), and for M-mode also mmtagexclude0/1, menvmtagexclude0/1 and (Smvatag) mvitt (M-level); then in the mode read each CSR with csrr and write another value with csrrw, recording the register, which holds a known value before (42 for the read, the value to write for the write); then read every CSR back in M-mode, recording it. The values are legal for every hart: tag table bases 4 KiB aligned, low exclusion masks within bits 15:1, high ones 0 without 7-bit tags (ZIMT_POINTER_TAG_WIDTH_7), where they are hardwired to zero, nonzero with them. The boot code sets both MT bits for the other tests, and the test sets them again at its end.
    expectation: |-
      M-mode: performed whatever the MT bits (cp_stateen_mt_m), as are its accesses to the M-level CSRs mmtagexclude0/1, menvmtagexclude0/1 and (Smvatag) mvitt, which the MT bits do not gate (cp_stateen_mt_m_level).
      S-mode (HS-mode with H): an illegal instruction exception with mstateen0.MT = 0 (cp_stateen_mt_s_off), performed with mstateen0.MT = 1 (cp_stateen_mt_s_on).
      U-mode: an illegal instruction exception (cp_stateen_mt_u).
      VS-mode and VU-mode: an illegal instruction exception with mstateen0.MT = 0, whatever hstateen0.MT was written before (cp_stateen_mt_v_off, with both values). With mstateen0.MT = 1, VS-mode raises a virtual instruction exception for the S-level CSRs with hstateen0.MT = 0 (cp_stateen_mt_vs_h_off) and performs them with hstateen0.MT = 1, svitts and svittu reaching vsvitts and vsvittu (cp_stateen_mt_vs_h_on); it raises a virtual instruction exception for the H-level CSRs (cp_stateen_mt_vs_hcsr), and VU-mode for all of them (cp_stateen_mt_vu_on), whatever hstateen0.MT (both crosses with both values).
      An access that traps leaves the register and the CSR unchanged; a write that is performed reaches the CSR it names, or vsvitts and vsvittu for svitts and svittu in VS-mode, as the values read back show.
      The set and clear forms (csrrs and csrrc with rs1 = 0x100, csrrwi 4, csrrsi 2, csrrci 4) of the accesses to senvmtagexclude0 and henvmtagexclude0 after the csrrw raise the same exceptions (cp_stateen_mt_forms), and leave 2 in the CSR when performed.
    bins: 2 (read, write) x 8 CSRs (4 without H or without Svatag, 2 without both) for each mode and state that the crosses name; M-level 2 x 5 CSRs (4 without Smvatag) x 2 (mstateen0.MT); forms 5 x 2 CSRs (1 without H) x 5 modes (3 without H) x 3 states (2 without H)
  - heading: Software-check exception (cause 18)
  - name: cp_swcheck_deleg
    goal: A software-check exception can be delegated
    description: Set and clear bit 18 of medeleg in M-mode (Zimt_Sm, with S-mode) and of hedeleg in HS-mode (Zimt_H), recording the bit.
    expectation: 1, then 0.
    bins: medeleg 2 (csrrs, csrrc), hedeleg 2
  - name: cp_swcheck_cause
    goal: The cause CSRs hold the software-check exception code
    description: Write 18 to mcause (M-mode), scause (S-mode) and vscause (HS-mode) and read it back.
    expectation: "18"
    bins: 3 CSRs
  - heading: gentag and addtag with memory tagging enabled (Zimt_Sm)
  - name: cp_gentag_mt_tag4_tag
    goal: gentag generates only a permitted tag (4-bit tags)
    description: |-
      With mseccfg.MT_MODE = 10, let mmtagexclude permit only one of the tags 0-15, for each of them, then gentag and record rd.
      Once with the mask bits of the tags 16-127 set and once with them clear, as gentag ignores them with 4-bit tags. Only with 7-bit tags must a hart keep those bits.
    expectation: rd = tag << 60.
    bins: 16 tags x 2 (mask bits of the tags 16-127 clear, not clear); 16 tags without 7-bit tags
  - name: cp_gentag_mt_tag7_tag
    goal: gentag generates only a permitted tag (7-bit tags; this and the other tag7 coverpoints exist only with them)
    description: With mseccfg.MT_MODE = 11, let mmtagexclude permit only one of the tags 0-15, for each of them, then gentag and record rd.
    expectation: rd = tag << 57.
    bins: 16 tags
  - name: cp_gentag_mt_tag7_high
    goal: gentag draws the tags above 15 (7-bit tags)
    description: |-
      With mseccfg.MT_MODE = 11, let mmtagexclude permit only 0 and a tag above 15, the first and last of each group of 16 tags, and draw up to 128 times until that tag comes.
      Record whether it came, with only 0 before it. Drawing uniformly, a hart misses it with probability 2^-128.
    expectation: "1"
    bins: 14 tags
  - name: cp_gentag_mt_several
    goal: gentag draws only permitted tags from masks permitting several
    description: Draw 32 tags with masks permitting the odd 4-bit tags, the even 7-bit tags, and the 7-bit tags 0-15 and 121-127, and record whether each draw was a permitted tag with the bits below it 0. The bins need masks permitting more than two tags, unlike the ones of cp_gentag_mt_tag7_high.
    expectation: "1"
    bins: 2 (4-bit, 7-bit tags); 1 without 7-bit tags
  - name: |-
      cp_gentag_mt_tag4
      cp_gentag_mt_tag7
    goal: gentag writes the generated tag to each rd
    description: With mmtagexclude permitting only tag 9, gentag rd for each rd != x0, then record rd.
    expectation: rd = 9 << 60 (4-bit tags) or 9 << 57 (7-bit tags).
    bins: 2 x 31 rd
  - name: |-
      cp_addtag_mt_tag4_imm
      cp_addtag_mt_tag7_imm
    goal: addtag adds imm4 to the pointer tag, which wraps
    description: addtag rd, rs1, imm4 for each imm4 != 0, from tag 5 (4-bit tags) or 120 (7-bit tags), then record rd. The exclusion mask permits only tag 9, which does not affect addtag.
    expectation: rd = rs1 with its tag replaced by (tag + imm4) mod 2^pointer_tag_width; the bits below the tag are kept.
    bins: 2 x 15 imm4
  - name: |-
      cp_addtag_mt_tag4_rd
      cp_addtag_mt_tag7_rd
      cp_addtag_mt_tag4_rs1
      cp_addtag_mt_tag7_rs1
      cp_addtag_mt_tag4_rd_rs1
      cp_addtag_mt_tag7_rd_rs1
    goal: addtag with each rd and rs1
    description: addtag rd, rs1, imm4 for each rd != x0, for each rs1, and with rd = rs1, then record rd.
    expectation: As for cp_addtag_mt_tag4_imm; rd = imm4 << 60 or imm4 << 57 for rs1 = x0.
    bins: 2 x (31 rd + 32 rs1 + 1)
  - name: |-
      cp_mop_rr_not_zimt_mt_tag4
      cp_mop_rr_not_zimt_mt_tag7
    goal: Encodings that miss one condition of a Zimt instruction stay Zimop instructions with memory tagging enabled
    description: The cp_mop_rr_not_zimt encodings with mseccfg.MT_MODE = 10 and 11.
    expectation: rd = 0. No exception.
    bins: 2 x 22 encodings
  - heading: gentag and addtag with memory tagging enabled in each mode
  - name: |-
      cp_gentag_mt_enabled
      cp_addtag_mt_enabled
    goal: Each mode uses its own MT_MODE field and exclusion mask
    description: |-
      Enable memory tagging with 4-bit and, if supported, with 7-bit tags, and let the exclusion mask permit only one tag, in each mode: S (menvcfg, menvmtagexclude, set from M-mode), U (senvcfg, senvmtagexclude, set from S-mode, so only with S-mode), VS (henvcfg, henvmtagexclude) and VU (senvcfg, senvmtagexclude, both set from HS-mode).
      The other modes' MT_MODE fields and masks hold other values, except where a trap handler runs: a field that another mode uses holds 00 while the mode under test uses 4-bit tags, and 10 while it uses 7-bit tags. In the mode, gentag, then addtag from the largest tag plus 1 and from tag 3 plus 5; record rd.
      cp_addtag_mt_enabled also crosses the Zimt_Sm addtag tests with wrapping (M-mode: mseccfg, mmtagexclude).
    expectation: rd = the permitted tag shifted to bits 63:60 or 63:57; addtag wraps the tag to 0, or gives 8.
    bins: S, U, VS, VU x 2 widths x (gentag, addtag with and without wrapping); M x 2 widths x (addtag with and without wrapping); 1 width without 7-bit tags
  - heading: settag with memory tagging enabled
  - name: |-
      cp_settag_mt_tag4_chunks
      cp_settag_mt_tag7_chunks
    goal: settag stores the pointer tag of rs1 in the tags of chunk_count + 1 consecutive chunks (Zimt_Sm_settag)
    description: |-
      In M-mode, with mvitt = the tag table and mseccfg.PMM set, settag rs1, chunk_count for each chunk_count, from each first chunk whose tag is at another place in a doubleword: with 4-bit tags (mseccfg.MT_MODE = 10) each half of each byte (rs1 bits 7:4), with 7-bit tags (11) each byte (rs1 bits 6:4).
      rs1 holds the tag 0xa (4-bit) or 0x5a (7-bit), and nonzero bits 3:0, which settag ignores. After each settag, record the doublewords of the tags and one on each side.
    expectation: The tags of the chunk_count + 1 chunks from the chunk of rs1 hold the tag; the other bytes and halves keep the pattern. No exception.
    bins: 16 first chunks x 16 chunk_count (4-bit tags) + 8 first chunks x 16 chunk_count (7-bit tags)
  - name: cp_settag_mt_tag4_rs1
    goal: settag with each rs1
    description: In M-mode with 4-bit tags, settag x<r>, 0 for each r != x0, with x<r> tagged with r % 16 and pointing to a chunk of its own; then record the tag table around the tags.
    expectation: The tag of the chunk of x<r> is r % 16. No exception.
    bins: 31 rs1
  - name: cp_settag_mt_enabled
    goal: settag uses the tag table, MT_MODE and PMM of the mode, and raises store/AMO faults at the tag address
    description: |-
      S-mode (Zimt_S_settag): with Sv39 translation, svitts = a virtual address that maps to the tag table, and menvcfg.MT_MODE and menvcfg.PMM set. settags whose tags cross from that page into a second one that is valid, invalid, read-only, clean (D = 0), or (with Svpbmt) IO or NC memory; one whose tags start 3 bytes into the faulting region of RVMODEL_ACCESS_FAULT_ADDRESS_STORE, in a page that maps to it; one whose page-table walk reads a level-0 table in the faulting region of RVMODEL_ACCESS_FAULT_ADDRESS_LOAD; and one with svitts at a non-canonical address (bit 46 set). The NC page is a third tag table page that only that mapping accesses, so no cacheable access aliases it. Record the doublewords around the page boundary.
      U-mode (Zimt_U_settag): svittu = the tag table, and senvcfg.MT_MODE and senvcfg.PMM set, from S-mode, which keeps memory tagging disabled. settags of 1, 16 and 6 chunks, then one whose tags start 3 bytes into the faulting region of RVMODEL_ACCESS_FAULT_ADDRESS_STORE, with svittu = its page.
      VS-mode and VU-mode (Zimt_H_settag): vsvitts = the first tag table page and vsvittu = the second, svitts = svittu = 0, and henvcfg.MT_MODE and henvcfg.PMM (VS) or senvcfg.MT_MODE and senvcfg.PMM (VU) set. The settags of U-mode without the fault; then HS-mode records both pages.
      Each with 4-bit and 7-bit tags. With 4-bit tags, the faulting settags start in an upper half and the crossing ones end in a lower half, so they read and write bytes they share with other chunks.
    expectation: |-
      The tags go to the tag table of the mode; the other bytes and halves keep the pattern.
      A tag in an invalid or read-only page, or at a non-canonical address: store/AMO page fault (cause 15); in a clean page, a store/AMO page fault with Svade, and none with Svadu, which sets D. In IO memory, which is not idempotent, in a faulting region, or behind a page-table walk that reads a faulting region: store/AMO access fault (cause 7). In NC memory, which is idempotent, no exception. xtval = the address of the first tag byte that faults, and the faulting tag bytes keep their value.
    bins: S 2 widths x 3 (no exception, store/AMO access fault, store/AMO page fault; no access fault without Svpbmt and the fault addresses); U 2 widths x 2 (no exception, store/AMO access fault; no access fault without RVMODEL_ACCESS_FAULT_ADDRESS_STORE); VS, VU x 2 widths; 1 width without 7-bit tags
  - name: cp_settag_addr_msb
    goal: settag uses the masked address of rs1, sign-extended with address translation and zero-extended without
    description: |-
      M-mode (Zimt_Sm_settag), without translation: settag of 16 chunks through a pointer with bit 56 (PMLEN 7) or bit 47 (PMLEN 16) set, which pointer masking zero-extends, and mvitt = the tag table minus the tag offset of that bit, so the tags land in the tag table.
      S-mode (Zimt_S_settag), with Sv39: the settag of the valid crossing case through a pointer with bits 56 and 47 set, the lowest Sv39 address of the upper half, which pointer masking sign-extends, and svitts wrapped around by the tag offset of the sign-extended bits, so the S-mode tag storage range starts at the tag table, above the test image. Record the tags as for the other cases.
      Each with 4-bit and 7-bit tags.
    expectation: The same tags as through a pointer without those bits. A hart that extends the other way stores its tags far from the tag table, where they fault.
    bins: M, S x 2 widths; 1 width without 7-bit tags
  - name: cp_settag_mprv
    goal: With MPRV, settag uses the tag table and MT_MODE of the current privilege, and the pointer masking and translation of the effective one
    description: |-
      In M-mode with mstatus.MPRV = 1 and MPP = S (Zimt_Sm_settag; needs S-mode, Smnpm and Svatag): mvitt = the first tag table page and mseccfg.MT_MODE set; menvcfg.PMM set and mseccfg.PMM = 00, satp = Bare; svitts = the second page and menvcfg.MT_MODE = 00. settag of 10 chunks, then record both pages around the tags.
      Each with 4-bit and 7-bit tags.
    expectation: The tags go to the first page, with the pointer tag masked; the second page keeps the pattern. No exception.
    bins: 2 widths; 1 width without 7-bit tags
  - name: |-
      cp_settag_two_stage
      cp_settag_g_stage
    goal: settag translates its tag addresses with the guest translation of VS-mode, and its G-stage faults are store/AMO guest-page faults
    description: |-
      In VS-mode (Zimt_H_settag; needs Sv39), with two-stage translation (vsatp = Sv39, hgatp = Sv39x4): vsvitts = a VS-stage page that maps to a guest physical page, which the G stage maps to the second tag table page. The VS-stage leaf is valid or read-only, and the G-stage leaf valid, read-only or invalid. With the G stage only (vsatp = Bare): vsvitts = a guest physical page that the G stage maps to the second tag table page, valid or read-only, or vsvitts = 2^41, above the guest physical addresses of Sv39x4.
      settag of 2 chunks; HS-mode takes the traps and records the second tag table page around the tags. Each with 4-bit and 7-bit tags.
    expectation: |-
      The tags go to the second tag table page through both stages.
      A read-only VS-stage leaf: store/AMO page fault (cause 15), htval = 0. A read-only or invalid G-stage leaf, or a guest physical address above 2^41: store/AMO guest-page fault (cause 23), htval = the guest physical address >> 2. xtval = the address of the first tag byte, hstatus.GVA = 1, and the tags keep their value.
    bins: two-stage 2 widths x 3 (no exception, store/AMO page fault, store/AMO guest-page fault); G stage only 2 widths x 2 (no exception, store/AMO guest-page fault); 1 width without 7-bit tags
  - heading: checktag and the implicit tag checks of loads and stores with memory tagging enabled
  - name: |-
      cp_checktag_mt_tag4_chunks
      cp_checktag_mt_tag7_chunks
    goal: checktag compares the tags of chunk_count + 1 consecutive chunks, and only those (Zimt_Sm_checktag)
    description: |-
      In M-mode, with mvitt putting the tags of a data page in the tag table and mseccfg.PMM set, checktag rs1, chunk_count for each chunk_count, from each first chunk whose tag is at another place in a doubleword: with 4-bit tags each half of each byte (rs1 bits 7:4), with 7-bit tags each byte (rs1 bits 6:4). The tags of those chunks match the pointer tag of rs1, and those of the chunks right before and after them do not.
    expectation: No exception. A hart that checks a chunk outside the range raises a software-check exception, which the M-mode trap handler cannot take with memory tagging enabled.
    bins: 16 first chunks x 16 chunk_count (4-bit tags) + 8 first chunks x 16 chunk_count (7-bit tags)
  - name: cp_checktag_mt_enabled
    goal: checktag compares the pointer tag of rs1 with the memory tags of its chunks, in the tag table of the mode, and raises load faults at the tag address
    description: |-
      S-mode (Zimt_S_checktag): with Sv39 translation and svitts as for Zimt_S_settag, checktags whose tags cross from the first tag table page into a second one that is valid with matching or mismatching tags, invalid, execute-only, not accessed (A = 0), or (with Svpbmt) IO or NC memory; one whose tags start 3 bytes into the faulting region of RVMODEL_ACCESS_FAULT_ADDRESS_LOAD; one whose page-table walk reads a level-0 table there; and one with svitts at a non-canonical address. The IO and NC pages map a third tag table page, which no cacheable access aliases.
      U-mode (Zimt_U_checktag), VS-mode and VU-mode (Zimt_H_checktag), with Bare translation: the data chunks 20 and 23 have a mismatching tag. checktags of chunks 16-19, 17-20, 20, 21-22, 21-23, 5-20 and 24-39, and of chunk 0 with a mismatching pointer tag; with 7-bit tags, of chunk 4 while its memory tag has bit 7 set, with the pointer tag of its other bits; then one with the tag table base in the faulting region of RVMODEL_ACCESS_FAULT_ADDRESS_LOAD.
      S-mode with Bare translation (Zimt_S_checktag, before Sv39): those whose chunks all match (16-19, 21-22 and 24-39). As in M-mode, no exception can be taken there with memory tagging enabled: the trap handlers would be tag checked, as the M-mode one reads the trapping instruction with mstatus.MPRV = 1 and MPP = S.
      Each with 4-bit and 7-bit tags.
    expectation: |-
      No exception if all the tags match; a software-check exception (cause 18, xtval = 4) at the first mismatching chunk, also for a memory tag with bit 7 set, which matches no 7-bit pointer tag. A tag in an invalid, execute-only or not accessed page, or at a non-canonical address: load page fault (cause 13; none in a not accessed page with Svadu, which sets A). In a faulting region, or behind a page-table walk that reads one: load access fault (cause 5). xtval = the address of the first tag byte that faults. IO and NC memory are readable: no exception.
    bins: S 2 widths x 4 (no exception, software check, load page fault, load access fault; no access fault without RVMODEL_ACCESS_FAULT_ADDRESS_LOAD); U, VS, VU x 2 widths x 3 (no exception, software check, load access fault); 1 width without 7-bit tags
  - name: cp_checktag_addr_msb
    goal: checktag uses the sign-extended masked address of rs1 with address translation
    description: In S-mode (Zimt_S_checktag), the checktag of the valid crossing case through a pointer with bits 56 and 47 set, with svitts wrapped around by the tag offset of the sign-extended bits, as for cp_settag_addr_msb. Each with 4-bit and 7-bit tags.
    expectation: No exception, as through a pointer without those bits.
    bins: 2 widths; 1 width without 7-bit tags
  - name: |-
      cp_checktag_mprv
      cp_checktag_mprv_m_pmm
    goal: With MPRV, checktag uses the MT_MODE and tag table of the current privilege, and the address translation (with its pointer masking) of the effective one
    description: In M-mode with mstatus.MPRV = 1 and MPP = S (Zimt_Sm_checktag), menvcfg.MT_MODE set and mseccfg.MT_MODE = 00, checktag through a pointer with a mismatching tag; then with mseccfg.MT_MODE set and menvcfg.MT_MODE = 00, and mseccfg.PMM = 00 while menvcfg.PMM is set, checktag of chunks with the matching tags in the mvitt tag table. Each with 4-bit and 7-bit tags.
    expectation: No exception for both. checktag does nothing with M-mode's memory tagging disabled, whatever S-mode's, and masks the pointer with S-mode's pointer masking.
    bins: 2 widths x (S-mode's memory tagging only, M-mode's only); 2 widths with mseccfg.PMM = 00 (cp_checktag_mprv_m_pmm); 1 width without 7-bit tags
  - name: |-
      cp_checktag_two_stage
      cp_checktag_g_stage
    goal: checktag translates its tag addresses with the guest translation of VS-mode, and its G-stage faults are load guest-page faults
    description: |-
      In VS-mode (Zimt_H_checktag; needs Sv39), the cases of cp_settag_two_stage and cp_settag_g_stage with checktag of 2 chunks, with execute-only instead of read-only leaves, and a two-stage case with mismatching tags. HS-mode fills the tags and takes the traps. Each with 4-bit and 7-bit tags.
    expectation: |-
      No exception through both stages with matching tags; a software-check exception with mismatching ones.
      An execute-only VS-stage leaf: load page fault (cause 13), htval = 0. An execute-only or invalid G-stage leaf, or a guest physical address above 2^41: load guest-page fault (cause 21), htval = the guest physical address >> 2. xtval = the address of the first tag byte, hstatus.GVA = 1.
    bins: two-stage 2 widths x 4 (no exception, software check, load page fault, load guest-page fault); G stage only 2 widths x 2 (no exception, load guest-page fault); 1 width without 7-bit tags
  - name: cp_checked_access
    goal: Each kind of load and store is tag checked against the memory tag of its chunk
    description: |-
      Each of lb, lbu, lh, lhu, lw, lwu, ld, sb, sh, sw, sd, c.lw, c.ld, c.sw, c.sd, c.lbu, c.lh, c.lhu, c.sb, c.sh (Zcb) and, with their extensions and outside VS-mode and VU-mode, flh, flw, fld, fsh, fsw, fsd, c.fld, c.fsd, on a data chunk of its own, with the matching pointer tag, then (except in M-mode) with a mismatching one. A load records rd, which holds a canary before; a store records the doubleword through sp. With 7-bit tags (except in M-mode), a load of a chunk whose memory tag has bit 7 set, with the pointer tag of its other bits.
      M-mode (Zimt_Sm_checktag) with mseccfg.MT_MODE set around each access; S-mode with Bare translation (Zimt_S_checktag) with menvcfg.MT_MODE, which as M-mode tests only the matching pointer tags; U-mode (Zimt_U_checktag) with senvcfg.MT_MODE; VS-mode and VU-mode (Zimt_H_checktag) with henvcfg.MT_MODE and senvcfg.MT_MODE. Each with 4-bit and 7-bit tags.
    expectation: With the matching tag, the access is performed. With a mismatching one, a software-check exception (cause 18, xtval = 4, htval = 0, GVA = 0), rd and memory unchanged.
    bins: M, S x 2 widths x 28 kinds; U 2 widths x 28 kinds x 2 outcomes; VS, VU x 2 widths x 20 kinds x 2 outcomes (fewer without the extensions; 1 width without 7-bit tags)
  - name: cp_checked_two_chunks
    goal: A misaligned load or store checks the tags of both chunks that it overlaps before any of its parts
    description: |-
      ld, lw, lh, sd, sw, sh and (outside VS-mode and VU-mode) fld and fsd over two chunks with matching tags; then (except in M-mode and S-mode) ld, lw, sh, sd and fsd over chunk 20 or 23, whose tag mismatches, as their first or second chunk. Each with 4-bit and 7-bit tags. In M-mode and S-mode only with hardware misaligned loads and stores (UDB_MISALIGNED_LDST): otherwise they trap, and the trap handlers would be tag checked.
    expectation: Performed with matching tags; without hardware misaligned loads and stores, the address-misaligned or access-fault exception of the access, after its tag check. A software-check exception with either chunk mismatching, with no byte of the access performed.
    bins: M, S (Bare) x 2 widths x (load, store) (with UDB_MISALIGNED_LDST); U, VS, VU x 2 widths x (load, store) x 2 outcomes; 1 width without 7-bit tags
  - name: |-
      cp_checked_sp
      cp_checked_sp_compressed
    goal: Loads and stores with sp as the base register are not tag checked
    description: ld and sd through sp holding a pointer with a mismatching tag, then with Zca c.ldsp, c.sdsp, c.lwsp and c.swsp and (with Zcd, outside VS-mode and VU-mode) c.fldsp and c.fsdsp, in M-mode, U-mode, S-mode (Bare), VS-mode and VU-mode with memory tagging enabled. Record the loaded values and the stored doublewords (through sp without a pointer tag, as the signature stores). Each with 4-bit and 7-bit tags.
    expectation: All performed. No exception.
    bins: M, U, S, VS, VU x 2 widths x (load, store), and x 4 or 6 compressed kinds; 1 width without 7-bit tags
  - name: cp_checked_order
    goal: Tag checks observe the older tag stores of the hart
    description: |-
      A store through sp to the tag of a data chunk, behind three divisions that delay its commit, right before a load, or a store, of the chunk with the stored tag; then (except in M-mode and S-mode) one that stores the old tag back right before the access with the new one. A settag of another chunk right before a load, or a store, of it with the new tag; then (except in M-mode and S-mode) one right before the access with the old tag. Record rd and the stored doubleword. M-mode, U-mode, S-mode (Bare), VS-mode and VU-mode, each with 4-bit and 7-bit tags.
    expectation: The accesses with the newly stored tag raise no exception; those with the old one a software-check exception, and the stores leave memory unchanged.
    bins: M, S x 2 widths x (load, store) x (after the tag store, after settag); U, VS, VU x 2 widths x (load, store) x (after the tag store, after settag) x 2 outcomes; 1 width without 7-bit tags
  - name: cp_checked_fault
    goal: The tag loads of the implicit checks raise load access faults, before the access faults of the data
    description: |-
      U-mode (Zimt_U_checktag), VS-mode and VU-mode (Zimt_H_checktag): with the tag table base in the faulting region of RVMODEL_ACCESS_FAULT_ADDRESS_LOAD, a load and a store whose tag is 3 bytes into it. U-mode: a load of the faulting region of RVMODEL_ACCESS_FAULT_ADDRESS_LOAD and a store to that of RVMODEL_ACCESS_FAULT_ADDRESS_STORE whose tags, in the tag table, match; then with a mismatching pointer tag. Each with 4-bit and 7-bit tags.
    expectation: |-
      A tag load that faults: load access fault (cause 5), also for a store, xtval = the address of the tag byte. A data access with matching tags: its access fault (cause 5 or 7), xtval = its address; with a mismatching pointer tag: a software-check exception, which comes first.
    bins: U 2 widths x 3 (load access fault of a load, of a store, store/AMO access fault); VS, VU x 2 widths x 2 (load access fault of a load, of a store); 1 width without 7-bit tags
  - name: |-
      cp_checked_mprv
      cp_checked_mprv_m_mt
    goal: With MPRV, loads and stores are checked with the MT_MODE and tag table of the effective privilege
    description: |-
      In M-mode with mstatus.MPRV = 1 and MPP = S (Zimt_Sm_checktag; needs S-mode, Smnpm and Svatag), satp = Bare, menvcfg.MT_MODE and menvcfg.PMM set and svitts putting the tags of the data page in the tag table, while mseccfg.MT_MODE = 00: a load and a store with the matching pointer tag, and a load and a store with a mismatching one. Then with mseccfg.MT_MODE set and menvcfg.MT_MODE = 00, a load and a store with a mismatching pointer tag. Each with 4-bit and 7-bit tags.
    expectation: The mismatching load and store with S-mode's memory tagging enabled raise a software-check exception, which M-mode takes; the other accesses raise none.
    bins: 2 widths x (load, store) x 2 outcomes with S-mode's memory tagging; 2 widths x (load, store) with M-mode's (cp_checked_mprv_m_mt); 1 width without 7-bit tags
  - name: cp_checked_translated
    goal: With first-stage address translation, the loads and stores of a page whose leaf PTE has no PTE.MTAG are not tag checked
    description: In S-mode with Sv39 (Zimt_S_checktag), and in VS-mode with two-stage translation (vsatp = Sv39, hgatp = Sv39x4) (Zimt_H_checktag), a load and a store of a tag table page, whose leaf PTE has no PTE.MTAG, through a pointer with a mismatching tag, whose own tags are not mapped. Each with 4-bit and 7-bit tags.
    expectation: Both performed. No exception.
    bins: S, VS x 2 widths x (load, store); 1 width without 7-bit tags
  - name: |-
      cp_checked_tagged_page
      cp_unchecked_page
    goal: With first-stage paging, a page whose leaf PTE has PTE.MTAG and X = 0 is a tagged-data page, whose loads and stores are tag checked; with X = 1 (a tagcheck-exempt code page), or for a supervisor access to a user page, PTE.MTAG makes no tagged-data page
    description: |-
      In S-mode with Sv39 and menvcfg.MT_MODE set (Zimt_S_checktag), with svitts putting the tags of the PTE.MTAG test pages in a tags page: a load and a store of a supervisor page with PTE.MTAG = 1 and X = 0 with a mismatching pointer tag, then with the matching one; and with a mismatching one, of a page with PTE.MTAG = 1 and X = 1, and (sstatus.SUM = 1) of a user page with PTE.MTAG = 1. Record rd and memory. Each with 4-bit and 7-bit tags.
      PTE.MTAG is not allocated yet: the tests use bit 58, the placeholder of the Sail model (PTE_MTAG, rvtest_experimental.h).
    expectation: In the tagged-data page, a software-check exception (cause 18, stval = 4) with the mismatching pointer tag, rd and memory unchanged, and the access with the matching one. The others are performed, with no exception.
    bins: 2 widths x (load, store) x 2 outcomes (cp_checked_tagged_page); 2 widths x (load, store) x (X = 1, user page) (cp_unchecked_page); 1 width without 7-bit tags
  - name: |-
      cp_checked_regular_tagged_page
      cp_unchecked_regular_page
    goal: With first-stage paging, LR/SC, AMOs and cbo.zero of a tagged-data page are tag checked, and those of a page with PTE.MTAG and X = 1 are not
    description: |-
      In S-mode with Sv39 and menvcfg.MT_MODE set (Zimt_S_checktag), on a chunk of the PTE.MTAG test pages: lr.d, sc.d (without a reservation), amoadd.d and amoswap.w of the tagged-data page with a mismatching pointer tag, then an LR/SC pair and the AMOs with the matching one; and an LR/SC pair and the AMOs of the page with PTE.MTAG = 1 and X = 1 with a mismatching one. On a cache block of those pages, filled with a pattern before each (Zicboz): cbo.zero of the tagged-data page with a mismatching pointer tag, with only the last chunk of the block mismatching (through a pointer into its first chunk with the matching tag) and with the matching one, and of the page with PTE.MTAG = 1 and X = 1 with a mismatching one. Record rd and memory. Each with 4-bit and 7-bit tags.
    expectation: In the tagged-data page, a software-check exception (cause 18, stval = 4) with a mismatching tag, rd and memory unchanged, and the access with the matching one (cbo.zero zeroes its block). In the other page, performed with no exception.
    bins: 2 widths x 5 kinds x 2 outcomes (cp_checked_regular_tagged_page); 2 widths x 5 kinds (cp_unchecked_regular_page); fewer without the extensions; 1 width without 7-bit tags
  - name: cp_checked_regular_misaligned
    goal: The tag check of a misaligned LR/SC or AMO comes before its address-misaligned exception with Bare translation, and after it with first-stage paging
    description: |-
      With a mismatching pointer tag: in M-mode with mstatus.MPRV = 1 and MPP = S (Zimt_Sm_checktag; needs S, Smnpm and Svatag), whose translation is Bare, lr.d and amoadd.d 4 bytes into a chunk; in S-mode with Sv39 (Zimt_S_checktag), amoadd.d 4 bytes into a chunk of the tagged-data page. Record rd and memory. Each with 4-bit and 7-bit tags.
    expectation: With Bare translation, a software-check exception (cause 18, xtval = 4), rd and memory unchanged. With Sv39, the store/AMO address-misaligned exception (cause 6), unchecked; where misaligned AMOs are supported (UDB_MISALIGNED_AMO), the software-check exception.
    bins: M 2 widths (cp_checked_regular_misaligned of Zimt_Sm_cg); S 2 widths (of Zimt_S_cg); 1 width without 7-bit tags
  - name: |-
      cp_mtag_nonleaf
      cp_mtag_mt_disabled
    goal: PTE.MTAG is reserved in non-leaf PTEs, and ignored in leaf PTEs with memory tagging disabled
    description: In S-mode with Sv39 (Zimt_S_checktag), a load and a store of the tagged-data page through a level-1 non-leaf PTE with PTE.MTAG; then with menvcfg.MT_MODE = 00 and pointer masking still enabled, a load and a store of the tagged-data page with a mismatching pointer tag. Record rd and memory.
    expectation: Through the non-leaf PTE, a load page fault (cause 13) and a store/AMO page fault (cause 15), stval = the address. With memory tagging disabled, both performed, with no exception.
    bins: 2 (load page fault, store/AMO page fault) (cp_mtag_nonleaf); 2 (load, store) (cp_mtag_mt_disabled)
  - name: |-
      cp_checked_straddle
      cp_unchecked_straddle
      cp_checked_straddle_fault
    goal: A load or store over two pages is tag checked in both if either is a tagged-data page, but never in a user page for a supervisor access, and not at all if its second page faults
    description: |-
      In S-mode with Sv39 and memory tagging enabled (Zimt_S_checktag), with misaligned loads and stores performed byte by byte (UDB_MISALIGNED_LDST with MISALIGNED_SPLIT_STRATEGY = sequential_bytes), so also over two pages: a doubleword load and store over a tagged-data page and a page without PTE.MTAG, with the chunk in the second page mismatching, then matching; a doubleword load (sstatus.SUM = 1) over a user tagged-data page and a supervisor tagged-data page, with the chunk in the user page mismatching, then also the one in the other page; a doubleword load over a page without PTE.MTAG and a user tagged-data page, with both chunks mismatching; a doubleword load and store over a page without PTE.MTAG and a tagged-data page, with the chunk in the first page mismatching, then (load) matching; and a doubleword load over a tagged-data page, with its chunk mismatching, and an unmapped page. Record rd and memory. Each with 4-bit and 7-bit tags.
    expectation: A software-check exception (cause 18, stval = 4) when a checked chunk mismatches, with no byte stored, also in the first page when only the second one is a tagged-data page; otherwise the access is performed. The chunk in the user page is not checked, and neither is the load over a page without PTE.MTAG and a user page. The load into the unmapped page raises its load page fault (cause 13), with stval the first byte of that page, rd unchanged.
    bins: 2 widths x (tagged-data page and no PTE.MTAG, user and tagged-data page, no PTE.MTAG and tagged-data page) x 2 outcomes (cp_checked_straddle); 2 widths (cp_unchecked_straddle); 2 widths (cp_checked_straddle_fault); 1 width without 7-bit tags
  - name: |-
      cp_mtag_code_access
      cp_mtag_code_checktag
      cp_mtag_code_straddle
    goal: The loads and stores of the instructions of a tagcheck-exempt code page (PTE.MTAG = 1, X = 1) are not tag checked, unlike checktag, and an instruction fetched partly from another code page is not exempt
    description: |-
      In S-mode with Sv39 and memory tagging enabled (Zimt_S_checktag), code in two pages of the test data, mapped as code pages (R, X) with or without PTE.MTAG, does a load, a store or a checktag through a pointer with a mismatching tag to the tagged-data page, then returns: the load and the store from a tagcheck-exempt code page, from one without PTE.MTAG, and from an execute-only tagcheck-exempt one (R = 0), and the checktag from the tagcheck-exempt one. With Zca, the load at the end of the first page, which straddles the second one, from a tagcheck-exempt code page followed by one without PTE.MTAG, then by a tagcheck-exempt one. Record rd and memory. Each with 4-bit and 7-bit tags.
    expectation: From the tagcheck-exempt code pages, the load and the store are performed. checktag, the load and the store from the code page without PTE.MTAG, and the straddling load unless both of its code pages are tagcheck-exempt raise a software-check exception (cause 18, stval = 4).
    bins: 2 widths x (load, store) x (exempt, not exempt, exempt execute-only) (cp_mtag_code_access); 2 widths (cp_mtag_code_checktag); 2 widths x 2 (cp_mtag_code_straddle, with Zca); 1 width without 7-bit tags
  - name: cp_vs_mtag_code_access
    goal: With two-stage translation, a VS-stage code page whose leaf PTE has PTE.MTAG and X = 1 is a tagcheck-exempt code page
    description: In VS-mode with two-stage translation (Zimt_H_checktag; needs Sv39), code mapped by the VS stage as a code page with PTE.MTAG (R, X) and without it does a load and a store through a pointer with a mismatching tag to the VS-stage tagged-data page, then returns. HS-mode takes the traps and records the doubleword the stores write. Each with 4-bit and 7-bit tags.
    expectation: From the tagcheck-exempt code page, both performed; from the other one, a software-check exception (cause 18, stval = 4, hstatus.GVA = 0), rd and memory unchanged.
    bins: 2 widths x (load, store) x (exempt, not exempt); 1 width without 7-bit tags
  - name: cp_mtag_i_deposit
    goal: A trap to HS-mode that writes a nonzero htinst deposits the VS-stage MTAG bit of the trapping instruction's code page in hstatus.MTAG_I
    description: In VS-mode with two-stage translation (Zimt_H_checktag; needs Sv39), the code pages of cp_vs_mtag_code_access load from a guest page whose VS-stage level-1 PTE points to a page table at a guest physical address that the G stage does not map, so the VS-stage walk takes a guest-page fault in an implicit access, for which htinst must hold a pseudoinstruction; hstatus.MTAG_I is 0 before the load from the tagcheck-exempt code page and 1 before the one from the other code page. HS-mode takes the traps, then records hstatus.MTAG_I. Each with 4-bit and 7-bit tags.
    expectation: A load guest-page fault (cause 21) with stval = the address, htval = the guest physical address of the PTE >> 2, htinst = 0x3000 (a 64-bit read for VS-stage address translation) and hstatus.GVA = 1; hstatus.MTAG_I is then 1 after the load from the tagcheck-exempt code page and 0 after the other one.
    bins: (exempt, not exempt)
  - name: cp_checked_vs_tagged_page
    goal: With two-stage translation, a page whose VS-stage leaf PTE has PTE.MTAG is a tagged-data page
    description: In VS-mode with two-stage translation (Zimt_H_checktag; needs Sv39), with vsvitts putting the tags of a guest page in the tag page of cp_checktag_two_stage, a load and a store of that guest page, whose VS-stage leaf PTE has PTE.MTAG, with the matching pointer tag and with a mismatching one. HS-mode takes the traps and records the doubleword the stores write. Each with 4-bit and 7-bit tags.
    expectation: With the matching tag, the access is performed; with a mismatching one, a software-check exception (cause 18, stval = 4, htval = 0, hstatus.GVA = 0), rd and memory unchanged.
    bins: 2 widths x (load, store) x 2 outcomes; 1 width without 7-bit tags
  - name: cp_mtag_g_stage
    goal: PTE.MTAG is reserved in G-stage PTEs
    description: In VS-mode with the G stage only (Zimt_H_checktag; needs Sv39) and henvcfg.MT_MODE = 00, a load and a store of a guest physical page whose G-stage leaf PTE has PTE.MTAG. HS-mode takes the traps.
    expectation: A load guest-page fault (cause 21) and a store/AMO guest-page fault (cause 23), stval = the address, htval = it >> 2, hstatus.GVA = 1.
    bins: 2 (load, store/AMO guest-page fault)
  - name: cp_checked_g_stage
    goal: With the G stage only (vsatp = Bare), all data pages are tagged-data pages (PTE.MTAG is a bit of first-stage page tables), so VS-mode loads and stores are tag checked, and the G stage translates their tag loads
    description: |-
      In VS-mode with hgatp = Sv39x4 and vsatp = Bare (Zimt_H_checktag; needs Sv39), with vsvitts putting the tags of the data chunks in the first tag table page, which the G stage maps with the test image: a load and a store of a data chunk with the matching pointer tag and with a mismatching one. Then, with vsvitts putting the tags in a guest physical page that the G stage maps execute-only: a load and a store with the matching pointer tag. HS-mode computes the pointers (the guest code runs at an alias), takes the traps and records the doubleword the stores write. Each with 4-bit and 7-bit tags.
    expectation: |-
      With the matching tag, the access is performed; with a mismatching one, a software-check exception (cause 18, stval = 4, htval = 0, hstatus.GVA = 0), rd and memory unchanged.
      With the tags in the execute-only page, the tag load raises a load guest-page fault (cause 21), also for the store: stval = the address of the tag byte, htval = it >> 2 (vsatp = Bare), htinst = 0, hstatus.GVA = 1; the access is not performed.
    bins: 2 widths x (load, store) x (no exception, software check, load guest-page fault); 1 width without 7-bit tags
  - name: cp_checked_mprv_v
    goal: With MPRV and MPV = 1, loads and stores are checked with the MT_MODE and tag table of VS-mode or VU-mode
    description: |-
      In M-mode with mstatus.MPRV = 1, MPV = 1 and Bare translation (vsatp, hgatp) (Zimt_Sm_checktag; needs H, Ssnpm and Svatag), with MPP = S and henvcfg.MT_MODE, henvcfg.PMM and vsvitts set, then with MPP = U and senvcfg.MT_MODE, senvcfg.PMM and vsvittu set, while mseccfg.MT_MODE = 00 and svitts = svittu = 0: a load and a store with the matching pointer tag, and with a mismatching one. Each with 4-bit and 7-bit tags.
    expectation: The mismatching ones raise a software-check exception (cause 18, mtval = 4, GVA = 0), which M-mode takes; the others none.
    bins: (VS, VU) x (load, store) x 2 outcomes
  - name: |-
      cp_checked_mprv_mtag_i
      cp_checked_mprv_v_mtag_i
    goal: With MPRV = 1 and mstatus.MTAG_I = 1, loads and stores are not tag checked
    description: In M-mode with mstatus.MPRV = 1 and Bare translation (Zimt_Sm_checktag), with the memory tagging of the effective privilege enabled as for cp_checked_mprv (MPP = S) and cp_checked_mprv_v (MPV = 1, with MPP = S and U), and mstatus.MTAG_I set and cleared with MPRV, a load and a store with a mismatching pointer tag. Record rd and memory. Each with 4-bit and 7-bit tags.
    expectation: Both performed. No exception.
    bins: MPP = S 2 widths x (load, store) (cp_checked_mprv_mtag_i); (VS, VU) x 2 widths x (load, store) (cp_checked_mprv_v_mtag_i, needs H, Ssnpm and Svatag); 1 width without 7-bit tags
  - name: |-
      cp_checked_mtag_i
      cp_checked_hstatus_mtag_i
    goal: mstatus.MTAG_I only makes loads and stores unchecked with MPRV = 1, and hstatus.MTAG_I only HLV and HSV
    description: |-
      In S-mode with Bare translation and memory tagging enabled (Zimt_S_checktag, with standard M-mode: STANDARD_SM_SUPPORTED; in Zimt_Sm_cg), with mstatus.MTAG_I = 1, which M-mode sets and clears, a load and a store with a mismatching pointer tag. M-mode takes their exceptions (medeleg[18] = 0), as the S-mode trap handler would be tag checked, and its trap handler reads the trapping instruction with MPRV = 1 and MPP = S, which MTAG_I makes unchecked: S-mode takes no other exception with memory tagging and Bare translation.
      In VS-mode and VU-mode with Bare translation and memory tagging enabled (Zimt_H_checktag), with hstatus.MTAG_I = 1, which HS-mode sets and clears, a load and a store with a mismatching pointer tag. Record rd and memory. Each with 4-bit and 7-bit tags.
    expectation: A software-check exception (cause 18, xtval = 4), rd and memory unchanged.
    bins: S 2 widths x (load, store) (cp_checked_mtag_i); (VS, VU) x 2 widths x (load, store) (cp_checked_hstatus_mtag_i); 1 width without 7-bit tags
  - name: |-
      cp_hlsv_checked
      cp_hlsv_vu_field_hs
      cp_hlsv_vu_field_hu
    goal: HLV and HSV are tag checked with the memory tagging, tag table and pointer masking of their guest mode
    description: |-
      In HS-mode with Bare vsatp and hgatp (Zimt_H_checktag), which make all guest pages tagged-data pages, and the tag table of the guest mode (vsvitts with hstatus.SPVP = 1, vsvittu with SPVP = 0) putting the tags of the data chunks in the tag table, while that of the other guest mode puts them in the second tag table page, where the chunk of the accesses has the mismatching tag: with SPVP = 1 (VS-mode) and henvcfg.MT_MODE and henvcfg.PMM set, hlv.d and hsv.d with the matching pointer tag and with a mismatching one; the same with SPVP = 0 (VU-mode) and senvcfg.MT_MODE and senvcfg.PMM set; then hlv.d with a mismatching pointer tag and hstatus.VUMT_MODE set instead of senvcfg.MT_MODE. In HU-mode (U-mode with hstatus.HU = 1 and hstatus.HUPMM set), with SPVP = 0, hlv.d with a mismatching pointer tag and hstatus.VUMT_MODE set, then senvcfg.MT_MODE set instead. Record rd and memory. Each with 4-bit and 7-bit tags.
    expectation: With the matching tag, the access is performed. With a mismatching one, in HS-mode with VS-mode's or (senvcfg.MT_MODE) VU-mode's memory tagging and in HU-mode with hstatus.VUMT_MODE, a software-check exception (cause 18, stval = 4) with hstatus.GVA = 1, which HS-mode takes, rd and memory unchanged; HS-mode with only hstatus.VUMT_MODE and HU-mode with only senvcfg.MT_MODE perform the load.
    bins: 2 widths x (VS, VU) x (hlv.d, hsv.d) x 2 outcomes (cp_hlsv_checked); 2 (senvcfg, VUMT_MODE) (cp_hlsv_vu_field_hs); 2 (cp_hlsv_vu_field_hu); 1 width without 7-bit tags
  - name: |-
      cp_hlsv_mtag_i
      cp_hlvx
    goal: hstatus.MTAG_I makes HLV and HSV unchecked, and HLVX is never tag checked
    description: In HS-mode as for cp_hlsv_checked with hstatus.SPVP = 1, hlv.d and hsv.d with a mismatching pointer tag and hstatus.MTAG_I = 1; then with MTAG_I = 0, hlv.wu and hlvx.wu through a pointer without a pointer tag to a chunk whose tag is not 0. Record rd and memory. Each with 4-bit and 7-bit tags.
    expectation: With MTAG_I = 1, both performed. hlv.wu raises a software-check exception (cause 18, stval = 4, hstatus.GVA = 1); hlvx.wu loads.
    bins: 2 (hlv.d, hsv.d) (cp_hlsv_mtag_i); 2 (hlv.wu, hlvx.wu) (cp_hlvx)
  - name: cp_hlsv_paged
    goal: With two-stage translation, HLV and HSV are tag checked in a VS-stage tagged-data page only, not in a user page for a supervisor access, and their tag loads are translated in two stages
    description: |-
      In HS-mode with hstatus.SPVP = 1, two-stage translation (vsatp = Sv39, hgatp = Sv39x4) and henvcfg.MT_MODE set (Zimt_H_checktag; needs Sv39), with vsvitts putting the tags of the guest pages in a tag page: hlv.d and hsv.d of the VS-stage tagged-data page with the matching pointer tag and with a mismatching one; with a mismatching one, of a page without PTE.MTAG and (vsstatus.SUM = 1) of a user tagged-data page; with misaligned accesses performed byte by byte, over the tagged-data page and the page without PTE.MTAG after it, whose chunk mismatches, and over the page without PTE.MTAG before it (the tag page) and it, whose chunk in the first page mismatches, then matches; and of the tagged-data page with vsvitts putting the tags in a guest page that the VS stage does not map, then in one whose guest physical page the G stage does not map. Record rd and memory. Each with 4-bit and 7-bit tags.
    expectation: |-
      With the matching tag, and in the page without PTE.MTAG and the user page, performed. With a mismatching tag in the tagged-data page, and over two pages, also in the page without PTE.MTAG before the tagged-data page, a software-check exception (cause 18, stval = 4, hstatus.GVA = 1), rd and memory unchanged; over the page before it with matching tags, performed.
      The tag loads raise a load page fault (cause 13), then a load guest-page fault (cause 21, htval = the guest physical address of the tag >> 2), with stval = the address of the tag, hstatus.GVA = 1, also for hsv.d.
    bins: (hlv.d, hsv.d) x 9 (match, mismatch, tag page fault, tag guest-page fault, no PTE.MTAG, user page, two pages, the page before and it mismatching, matching) x 2 widths; without byte by byte misaligned accesses 6; 1 width without 7-bit tags
  - name: |-
      cp_hlsv_gva
      cp_swcheck_gva
      cp_checked_mprv_v_gva
    goal: The software-check exception of a tag mismatch sets GVA for HLV and HSV only
    description: The software-check exceptions of cp_hlsv_checked and cp_hlsv_paged (HLV and HSV, which HS-mode takes), of cp_checked_access in VS-mode and VU-mode (which HS-mode takes), and of cp_checked_mprv_v (which M-mode takes).
    expectation: hstatus.GVA = 1 for HLV and HSV; hstatus.GVA = 0 and mstatus.GVA = 0 for the loads and stores.
    bins: 2 (hlv.d, hsv.d) (cp_hlsv_gva); (VS, VU) x (load, store) (cp_swcheck_gva); (VS, VU) x (load, store) (cp_checked_mprv_v_gva)
  - name: |-
      cp_checked_mprv_u_page
      cp_checked_mprv_vu_page
    goal: With first-stage paging, the loads of U-mode and VU-mode are tag checked in user tagged-data pages, which only supervisor accesses do not check, and not in pages without PTE.MTAG
    description: |-
      In M-mode with mstatus.MPRV = 1 and MPP = U, senvcfg.MT_MODE, senvcfg.PMM and svittu set and Sv39 translation (Zimt_S_checktag, with standard M-mode: STANDARD_SM_SUPPORTED; needs U and Ssnpm): a load of a user tagged-data page with a mismatching pointer tag and with the matching one, and of a user page without PTE.MTAG with a mismatching one. The same with MPV = 1, vsvittu and two-stage translation, of VS-stage user pages (Zimt_H_checktag, with standard M-mode; needs Sv39). Record rd. svittu and vsvittu put the tags in an alias of the tag page above the data pages, so that the VITT range of U-mode and VU-mode, which starts there, does not hold them. Each with 4-bit and 7-bit tags.
    expectation: The load of the user tagged-data page with a mismatching tag raises a software-check exception (cause 18, mtval = 4, GVA = 0), which M-mode takes, rd unchanged; the others are performed.
    bins: 2 widths x 3 (cp_checked_mprv_u_page); 2 widths x 3 (cp_checked_mprv_vu_page); 1 width without 7-bit tags
  - name: cp_unchecked_access
    goal: Prefetches, cbo.clean and cbo.flush are not tag checked, and HLV and HSV not with the memory tagging of M-mode
    description: |-
      With memory tagging enabled and a pointer tag that does not match: prefetch.r and prefetch.w (Zicbop), which are hints that perform no memory access, through a pointer with a mismatching tag, in M-mode, U-mode, S-mode (Bare), VS-mode and VU-mode; in M-mode also cbo.clean and cbo.flush (Zicbom), which perform cache-block operations and no load or store, and hsv.d and hlv.d (H) with hstatus.SPVP = 0 through a pointer without a tag, whose chunk has a tag (HLV and HSV are checked with the memory tagging of their guest mode, here VU-mode's, senvcfg.MT_MODE = 00, not M-mode's). Record the doubleword that hlv.d loads and memory. Each with 4-bit and 7-bit tags.
    expectation: No exception; all performed.
    bins: M 2 widths x up to 6 kinds; U, S, VS, VU x 2 widths x (prefetch.r, prefetch.w) (fewer without the extensions; 1 width without 7-bit tags)
  - name: cp_checked_regular
    goal: The regular accesses besides loads and stores, LR/SC, AMOs, cbo.zero and vector loads and stores, are tag checked
    description: |-
      On data chunks of their own: lr.d and sc.d (an LR/SC pair), amoadd.d, amoswap.w and cbo.zero (Zicboz, through a pointer into the second chunk of its cache block, which holds a pattern before) with the matching pointer tag, then (except in M-mode and S-mode) with a mismatching one: lr.d, sc.d without a reservation, sc.d after an lr.d with the matching tag, amoadd.d, amoswap.w and cbo.zero. In M-mode also (V) vse64.v, vsse64.v, vsuxei64.v, masked vse64.v, vle64.v, masked vle64.v, vlse64.v, vluxei64.v and vle64ff.v of two 64-bit elements, with the matching pointer tag. A load records rd, which holds a canary before; memory is recorded through sp. Each vector store has data of its own and is followed by the record of the doublewords it may write; a vector load records both elements of vd, which holds a canary before (the masked load, with mu, leaves its masked-off element undisturbed). M-mode (Zimt_Sm_checktag) with mseccfg.MT_MODE set around each access; S-mode with Bare translation (Zimt_S_checktag) with menvcfg.MT_MODE; U-mode (Zimt_U_checktag); VS-mode and VU-mode (Zimt_H_checktag). Each with 4-bit and 7-bit tags.
    expectation: With the matching tag, the access is performed (the SC of the pair succeeds; cbo.zero zeroes the whole block). With a mismatching one, a software-check exception (cause 18, xtval = 4, GVA = 0), rd and memory unchanged, whether the SC would succeed or not.
    bins: M 2 widths x up to 14 kinds; S 2 widths x 5 kinds; U, VS, VU x 2 widths x 5 kinds x 2 outcomes (fewer without the extensions; 1 width without 7-bit tags)
  - name: cp_checked_regular_mprv
    goal: LR/SC, AMOs, cbo.zero and vector loads and stores with MPRV are checked with the memory tagging of the effective privilege mode, element by element for the vector ones
    description: |-
      In M-mode with mstatus.MPRV = 1 and MPP = S, S-mode's menvcfg.MT_MODE and svitts, and mseccfg.MT_MODE = 00 (Zimt_Sm_checktag; needs S, Smnpm and Svatag): lr.d, sc.d (without a reservation), amoadd.d, amoswap.w and cbo.zero (Zicboz, after a pattern is written to its block) with a mismatching pointer tag, then an LR/SC pair, the AMOs and cbo.zero with the matching one, and cbo.zero whose block mismatches only in its last chunk, through a pointer with the matching tag into its first chunk. (V) vle64.v, vse64.v and vle64ff.v of two 64-bit elements with a mismatching pointer tag, then with the matching one; with the tag of the chunk of element 1 mismatching, vsse64.v with stride 16 and vle64ff.v from 8 bytes before that chunk, and masked vle64.v and vse64.v from 8 bytes before it, masked vlse64.v and vsse64.v with stride 16, and masked vluxei64.v and vsuxei64.v with indices 0 and 16, with element 1 masked off and (except vsse64.v) active, and vlse64.v, vluxei64.v and vsuxei64.v unmasked. Record rd, memory after each store (a pattern is written before), both elements of vd after each load that does not trap (a canary before, with mu; the trimmed vle64ff.v, element 0 only), vstart and vl. Each with 4-bit and 7-bit tags.
    expectation: With a mismatching tag, a software-check exception (cause 18, mtval = 4, GVA = 0), which M-mode takes, rd and memory unchanged, at element 0 for the vector ones (vl unchanged); cbo.zero mismatching only in its last chunk raises it too, no byte zeroed. With the matching one, performed. vsse64.v stores element 0 and raises the exception at element 1 (vstart = 1), whose doubleword keeps the pattern; vle64ff.v raises none, loads element 0 and trims vl to 1. A masked-off element 1 is not checked (no exception, element 0 performed, element 1 undisturbed); an active one raises the exception at element 1 (vstart = 1), after element 0 (if active).
    bins: 2 widths x up to 14 kinds x 2 outcomes; 1 width without 7-bit tags
  - name: cp_trigger_before_check
    goal: A load or store address breakpoint (Sdtrig) that fires before the access has priority over the tag check of the access
    description: |-
      In M-mode with mstatus.MPRV = 1 and MPP = S, S-mode's menvcfg.MT_MODE and svitts, and mseccfg.MT_MODE = 00 (Zimt_Sm_trigger; needs S, Smnpm, Svatag and Sdtrig, with an mcontrol6 trigger among triggers 0-15 whose m, load and store bits are writable and match = 0 legal, and tdata2, as the Sdtrig tests gate their mcontrol6 cases), with the first such trigger an mcontrol6 trigger of M-mode (and of S-mode where s is writable, so that it matches whether the hart takes the privilege of an MPRV access as M or MPP; tdata3 = 0) with the breakpoint action (mstatus.MIE = 1, and tcontrol.MTE = 1 with that reentrancy) on the address of the access, a load trigger for ld, lr.d and (V) vle64.v of two 64-bit elements, vlse64.v (stride 16), vluxei64.v (offsets 0 and 16) and vle64ff.v (on element 0), a store trigger for sd, sc.d, amoadd.d, (V) vse64.v and cbo.zero (Zicboz; through and on the 256-byte aligned base of its block, which holds a pattern before, so that every compare option of the Debug spec for cache operations gives that address for blocks of up to 256 bytes), each through a pointer with a mismatching pointer tag. The sc.d holds the reservation of an lr.d through the matching pointer tag just before it (a constrained LR/SC sequence; the store trigger does not match the lr.d), as the Debug spec leaves it unspecified whether a failing sc matches store triggers. As the Sdtrig tests do, the test assumes that load and store address triggers fire before the access, the timing that the Debug spec suggests (mcontrol6 triggers may fire whenever it is convenient, and the priority of a breakpoint over the exceptions of the access holds only for one that fires before it). Record rd (a canary before), memory, and for vle64.v vstart and vd. Each with 4-bit and 7-bit tags.
    expectation: A breakpoint exception (cause 3, mtval = the address, or 0 on a hart that does not report it (REPORT_VA_IN_MTVAL_ON_BREAKPOINT); element 0 for vle64.v, vstart = 0), which M-mode takes, not the software-check exception of the tag check; rd, vd and memory unchanged.
    bins: up to 11 kinds (ld, sd, lr.d, sc.d, amoadd.d, cbo.zero, vle64.v, vse64.v, vlse64.v, vluxei64.v, vle64ff.v)
  - name: cp_trigger_amo_xsl
    goal: An AMO is both a load and a store for triggers, and either trigger has priority over its tag check
    description: As cp_trigger_before_check, amoadd.d with a mismatching pointer tag under a store trigger and under a load trigger on its address. Record rd and memory. Each with 4-bit and 7-bit tags.
    expectation: A breakpoint exception with either trigger, not the software-check exception; rd and memory unchanged.
    bins: 2 (load trigger, store trigger)
  - name: cp_trigger_tag_load
    goal: The tag loads of an implicit tag check are not matched by triggers
    description: As cp_trigger_before_check, with a load trigger on the tag byte of the chunk of the access (svitts + (address >> 5) with 4-bit tags, + (address >> 4) with 8-bit tags), ld, sd and amoadd.d with the matching pointer tag and with a mismatching one, and with the matching one an LR/SC pair (a constrained sequence; the sc rewrites the value loaded, and whether it succeeds is not recorded), vse64.v and cbo.zero (its block filled with a pattern before). Record rd and memory. Each with 4-bit and 7-bit tags.
    expectation: With the matching tag, performed, no exception; with a mismatching one, a software-check exception (cause 18, mtval = 4), not a breakpoint exception.
    bins: ld 2 (matching, mismatching), sd 2, amoadd.d 2, lr.d 1, sc.d 1, vse64.v 1, cbo.zero 1
  - name: cp_checktag_sp
    goal: checktag with sp as rs1 is tag checked, unlike the loads and stores with sp as the base register
    description: checktag with sp as rs1 holding a pointer with the matching tag, then (except in M-mode and S-mode) with a mismatching one, in M-mode, U-mode, S-mode (Bare), VS-mode and VU-mode with memory tagging enabled. Each with 4-bit and 7-bit tags.
    expectation: No exception with the matching tag; a software-check exception (cause 18, xtval = 4) with the mismatching one.
    bins: M, S x 2 widths; U, VS, VU x 2 widths x 2 outcomes; 1 width without 7-bit tags
  - name: cp_swcheck_to_vs
    goal: hedeleg[18] delegates the software-check exceptions of VU-mode to VS-mode
    description: In VU-mode with Bare translation and memory tagging enabled (Zimt_H_checktag), with hedeleg[18] = 1 and VS-mode's memory tagging disabled, checktag and a load through a pointer with a mismatching tag. Each with 4-bit and 7-bit tags.
    expectation: Software-check exceptions that VS-mode takes (vscause = 18, vstval = 4).
    bins: 2 widths x (checktag, load); 1 width without 7-bit tags
  - heading: Protection of tag storage (Svatag)
  - name: cp_vitt
    goal: With first-stage paging, the regular accesses in the VITT range of the mode raise access faults, after their page faults and tag check, and so does a settag whose chunks overlap it
    description: |-
      In S-mode (Zimt_S_checktag) with Sv39, menvcfg.MT_MODE and PMM set, and svitts putting the VITT range of S-mode at the tags page of the MTAG pages: the executable page (PTE.MTAG and X = 1, so not checked) before it is outside the range; 2^33 (4-bit tags) or 2^34 (7-bit tags) bytes up, an alias of the executable page is its last page and an alias of the tags page the page after it. A load and a store in its first page; a load through sp there (sp, saved around it, holds the pointer); loads in the page before, in the last page and in the page after; a load in the tagged-data page after the first one, whose tag address is not canonical; a load in the unmapped page after that; (hardware misaligned loads and stores split byte by byte) misaligned loads from the page before into the first page and from the last page into the page after, and a store from the page before into the first page; (Zalrsc) lr.d in the first page, lr.d of the same address through the page after, which reserves it, then sc.d in the first page; (Zaamo) amoadd.d there; (Zicboz) cbo.zero there; settag of a chunk in the first page; settag of 2 chunks, the last one of the page before and the first one of the range, and of 2 chunks, the last one of the range and the first one of the page after; settag of the last chunk of the page before alone. The load, the store, cbo.zero and the first settag use a pointer with a pointer tag, which pointer masking ignores. Record rd, which holds a canary before, and, through the page after the range, the memory that the faulting sd, sc.d, amoadd.d and cbo.zero would write (the cache block of cbo.zero holds a nonzero pattern before). Each with 4-bit and 7-bit tags.
    expectation: The accesses in the range raise a load access fault (cause 5; ld, also through sp, and lr.d) or a store/AMO access fault (cause 7; sd, sc.d, amoadd.d, cbo.zero, settag), stval = the access address, pointer-masked (for the load into the first page, that of its first byte in the range, the first byte of the page; for cbo.zero and settag, the masked rs1 address, also when only a later chunk overlaps the range), rd and memory unchanged; sc.d raises it with a reservation, so it may not fail instead ("a failed SC may be treated like a store"). The loads before and after the range, and the lr.d through the page after it, are performed. The load in the tagged-data page raises the load page fault of its tag load (stval = the tag address), the one in the unmapped page its load page fault (cause 13, stval = its address). The settag of the last chunk before the range alone raises the store/AMO page fault of its tag store (cause 15, stval = its non-canonical tag address). The store into the first page raises the store/AMO access fault at the first byte of the range, after storing its bytes in the page before.
    bins: 2 widths x up to 20 cases (fewer without the extensions or hardware misaligned loads; 1 width without 7-bit tags)
  - name: cp_vitt_settag_16
    goal: settag is protected if any of its chunks overlaps the VITT range, also its last one only
    description: In S-mode (Zimt_S_checktag) with the VITT range of cp_vitt, settag of 16 chunks (imm4 = 15) from the page before the range, of which only the last one is in its first page. Each with 4-bit and 7-bit tags.
    expectation: A store/AMO access fault (cause 7), stval = the masked rs1 address, and no tag store.
    bins: 2 widths; 1 width without 7-bit tags
  - name: cp_vitt_mt_disabled
    goal: Without memory tagging, there is no VITT range
    description: In S-mode (Zimt_S_checktag) with Sv39 and svitts of cp_vitt, but menvcfg.MT_MODE = 00, a load in the first page of the range that 4-bit tags would give. Record rd.
    expectation: The load is performed.
    bins: 1
  - name: cp_vitt_u
    goal: U-mode's own regular accesses and settag are protected with its VITT range
    description: In U-mode (Zimt_S_checktag; needs U and Ssnpm) with Sv39, running from a user alias of the code region (a gigapage below the range, registered for the T-SBI mode switches meanwhile), senvcfg.MT_MODE and PMM set and svittu putting the VITT range of U-mode at the user tags page of the MTAG pages, a settag and a load in its first page, through a pointer with a pointer tag. Record rd in S-mode. Each with 4-bit and 7-bit tags.
    expectation: A store/AMO access fault (cause 7) and a load access fault (cause 5), stval = the masked address, rd unchanged.
    bins: 2 widths x (ld, settag); 1 width without 7-bit tags
  - name: cp_vitt_v
    goal: The own regular accesses and settag of VS-mode and VU-mode are protected with their VITT ranges
    description: In VS-mode with two-stage translation (Zimt_H_checktag; needs Sv39), henvcfg.MT_MODE set and vsvitts putting the VITT range of VS-mode at the guest page without PTE.MTAG, a load and a settag in its first page; in VU-mode, from the guest code alias as a user page, senvcfg.MT_MODE set and vsvittu putting the VITT range of VU-mode at the VS-stage user page without PTE.MTAG, a settag and a load in its first page. Through a pointer with a pointer tag. Record rd (in HS-mode for VU-mode). Each with 4-bit and 7-bit tags.
    expectation: A load access fault (cause 5) and a store/AMO access fault (cause 7), which HS-mode takes, stval = the masked address, hstatus.GVA = 1, rd unchanged.
    bins: 2 widths x (VS, VU) x (ld, settag); 1 width without 7-bit tags
  - name: cp_vitt_hlvx
    goal: HLVX is not a regular access, so the VITT range does not protect it
    description: In HS-mode with two-stage translation (Zimt_H_checktag; needs Sv39) and hstatus.SPVP = 1, with vsvitts putting the VITT range of VS-mode at the VS-stage code page without PTE.MTAG, hlvx.wu there. Record rd. Each with 4-bit and 7-bit tags.
    expectation: hlvx.wu is performed, so rd = the instruction word.
    bins: 2 widths; 1 width without 7-bit tags
  - name: |-
      cp_vitt_gva
      cp_vitt_u_gva
      cp_vitt_mprv_u_gva
      cp_vitt_mprv_v_gva
      cp_vitt_hlsv_gva
      cp_vitt_hlsv_hu_gva
      cp_vitt_v_gva
    goal: The access faults of the protection of tag storage write GVA as other access faults do
    description: With H, the access faults of cp_vitt (S-mode), cp_vitt_u (U-mode), cp_vitt_mprv_u (MPRV with MPP = U), cp_vitt_mprv_v (MPRV with MPV = 1), cp_vitt_hlsv (HLV and HSV), cp_vitt_hlsv_hu (HU-mode) and cp_vitt_v (VS-mode and VU-mode).
    expectation: GVA (hstatus.GVA for a trap to HS-mode, mstatus.GVA for one to M-mode) is 1 at effective V = 1 (MPRV with MPV = 1, HLV and HSV, VS-mode and VU-mode), and 0 otherwise.
    bins: GVA = 0 in S-mode and U-mode (2 widths each) and with MPRV and MPP = U; GVA = 1 with MPRV and MPV = 1 (VS, VU), for HLV and HSV (SPVP = 0 and 1), in HU-mode and in VS-mode and VU-mode; 1 width without 7-bit tags
  - name: cp_svukte_tag
    goal: Svatag depends on Svukte, which qualifies the tag accesses of U-mode, so with senvcfg.UKTE its tag table must be in the lower half of the address space
    description: In U-mode (Zimt_S_checktag; needs U, Ssnpm and Svukte) with Sv39, running from a user alias of the code region, senvcfg.MT_MODE and PMM set, and svittu putting the tags of the user tagged-data page of the MTAG pages in an alias of the user tags page in the upper half (VA bit 63 set). With senvcfg.UKTE = 0, checktag, ld and settag (of a mismatching tag) of a chunk there, through a pointer with the matching pointer tag; then with UKTE = 1 the same (settag with the matching tag again restored first). With svittu in the lower half and UKTE = 1, ld of the chunk. ld of the upper alias of the user tagged-data page with UKTE = 1, and with UKTE = 0. Record rd in S-mode, and the tag byte after each settag. Each with 4-bit and 7-bit tags.
    expectation: With UKTE = 0, checktag passes, ld is performed and settag stores the tag. With UKTE = 1, checktag and ld raise a load page fault and settag a store/AMO page fault (cause 13, 15) with stval = the tag address in the upper half, rd unchanged and no tag stored. With the tag table in the lower half, ld is performed. ld of the upper alias raises a load page fault at its own address with UKTE = 1 (Svukte, before the tag check), and with UKTE = 0 at its tag address, which is not canonical (the tag table of U-mode holds the tags of the lower half only).
    bins: 2 widths x 9 cases; 1 width without 7-bit tags
  - name: cp_svukte_tag_mprv
    goal: Svukte qualifies the tag accesses of the loads with mstatus.MPRV = 1 and MPP = U
    description: In M-mode with mstatus.MPRV = 1 and MPP = U (Zimt_S_checktag, with standard M-mode; needs U, Ssnpm and Svukte) and svittu as in cp_svukte_tag (upper half), ld of the chunk with senvcfg.UKTE = 1 and with UKTE = 0. Record rd. Each with 4-bit and 7-bit tags.
    expectation: With UKTE = 1, a load page fault (cause 13) with mtval = the tag address, which M-mode takes, rd unchanged; with UKTE = 0, the load is performed.
    bins: 2 widths x 2 cases; 1 width without 7-bit tags
  - name: |-
      cp_svukte_tag_v
      cp_svukte_tag_hu
      cp_svukte_tag_hs
    goal: Svukte qualifies the tag accesses of VU-mode (senvcfg.UKTE) and of HLV with hstatus.SPVP = 0 (hstatus.HUKTE in HU-mode, senvcfg.UKTE in HS-mode)
    description: With two-stage translation (Zimt_H_checktag; needs Sv39 and Svukte), a VS-stage root PTE mapping the guest pages again in the upper half, and vsvittu putting the tags of the VS-stage user tagged-data page in the upper alias of the user tags page. In VU-mode (running from the guest code alias as a user page, senvcfg.MT_MODE and PMM set) ld and settag of a chunk there with senvcfg.UKTE = 1, and ld with UKTE = 0. hlv.d of the chunk in HU-mode (hstatus.HU, SPVP = 0, VUMT_MODE and HUPMM set) with hstatus.HUKTE = 1 and UKTE = 0, and with HUKTE = 0 and UKTE = 1; and in HS-mode with UKTE = 1 and HUKTE = 0, and with UKTE = 0 and HUKTE = 1 (hstatus.MTAG_I = 0). Record rd. Each with 4-bit and 7-bit tags.
    expectation: A load page fault (cause 13; for settag a store/AMO page fault, cause 15) with stval = the tag address and hstatus.GVA = 1, which HS-mode takes, rd unchanged, with the enable of the mode (UKTE in VU-mode and for HLV in HS-mode, HUKTE for HLV in HU-mode); performed with the other one alone.
    bins: 2 widths x (VU 3, HU 2, HS 2); 1 width without 7-bit tags
  - name: |-
      cp_vitt_mprv_u
      cp_vitt_mprv_v
    goal: The VITT range is that of the effective privilege mode, with MPRV
    description: |-
      In M-mode with mstatus.MPRV = 1 and MPP = U, senvcfg.MT_MODE and PMM set, and Sv39 translation, with svittu putting the VITT range of U-mode at the user tags page (Zimt_S_checktag, with standard M-mode; needs U and Ssnpm): loads in its first page, in the user page without PTE.MTAG before it, in its last page (an alias of that page 2^33 or 2^34 bytes up) and in the page after it, and (hardware misaligned loads split byte by byte) from the page before into the first page and from the last page into the page after; (V) vle64.v and vse64.v of two 64-bit elements in its first page; then with svittu putting the range over the MTAG pages and the tags of their chunks in the user tags page, loads of the user tagged-data page in it with the matching pointer tag and with a mismatching one (cp_vitt_mprv_u). With MPV = 1 and two-stage translation (Zimt_H_checktag, with standard M-mode; needs Sv39), with MPP = S (henvcfg.MT_MODE) and vsvitts putting the VITT range of VS-mode at the guest page without PTE.MTAG after VS_MTAG_VA, and with MPP = U (senvcfg.MT_MODE) and vsvittu putting that of VU-mode at the VS-stage user page without PTE.MTAG: a load in the first page of the range, and one in the tagged-data page before it with mstatus.MTAG_I = 1, so not checked (cp_vitt_mprv_v). The first load of the U-mode range, vle64.v and the loads in the VS-mode and VU-mode ranges use a pointer with a pointer tag, which pointer masking ignores. Record rd, which holds a canary before, vd of vle64.v, which holds a pattern before, and the memory of vse64.v. Each with 4-bit and 7-bit tags.
    expectation: The loads in the range raise a load access fault (cause 5, mtval = the access address, for the load into the first page the first byte of that page; GVA = 0, and GVA = 1 with MPV = 1), which M-mode takes, rd unchanged; vle64.v a load access fault and vse64.v a store/AMO access fault (cause 7) at element 0 (mtval = the masked rs1), vd and memory unchanged; the others are performed. In the user tagged-data page, the tag check comes first; with the matching pointer tag it passes and the load raises the load access fault, with a mismatching one a software-check exception (cause 18, mtval 4).
    bins: 2 widths x up to 10 cases (cp_vitt_mprv_u); 2 widths x (VS, VU) x 2 cases (cp_vitt_mprv_v); 1 width without 7-bit tags
  - name: cp_vitt_mtag_i
    goal: mstatus.MTAG_I disables the tag checks of the accesses with MPRV, not the protection of tag storage
    description: |-
      In M-mode with mstatus.MPRV = 1, MPP = U and mstatus.MTAG_I = 1, a load in the first page of the VITT range of U-mode of cp_vitt_mprv_u (Zimt_S_checktag, with standard M-mode; needs U and Ssnpm), and one in the user tagged-data page of cp_vitt_mprv_u in the range over the MTAG pages, with a mismatching pointer tag. Record rd. Each with 4-bit and 7-bit tags.
    expectation: A load access fault (cause 5, mtval = its address), which M-mode takes, rd unchanged; the tagged-data page is not tag checked.
    bins: 2 widths x 2 cases; 1 width without 7-bit tags
  - name: cp_vitt_hlsv
    goal: HLV and HSV are protected with the VITT range of their guest mode, whatever hstatus.MTAG_I
    description: |-
      In HS-mode with two-stage translation (Zimt_H_checktag; needs Sv39) and hstatus.MTAG_I = 1, which disables the tag checks of HLV and HSV, through a pointer with a pointer tag, which pointer masking (henvcfg.PMM, senvcfg.PMM) ignores: with hstatus.SPVP = 1 (henvcfg.MT_MODE) and vsvitts putting the VITT range of VS-mode at the guest page without PTE.MTAG, and with SPVP = 0 (senvcfg.MT_MODE) and vsvittu putting that of VU-mode at the VS-stage user tagged-data page, hlv.d and hsv.d in the first page of the range; svitts, the tag table base of HS-mode, is 32 GiB above those pages, so that neither of the ranges it would give holds them. Record rd, and the check data that the accesses map. Each with 4-bit and 7-bit tags.
    expectation: hlv.d raises a load access fault (cause 5) and hsv.d a store/AMO access fault (cause 7), stval = the masked access address, hstatus.GVA = 1, rd and memory unchanged.
    bins: 2 widths x (VS, VU) x (hlv.d, hsv.d); 1 width without 7-bit tags
  - name: cp_vitt_hlsv_hu
    goal: In HU-mode, HLV and HSV of VU-mode are protected with the VITT range that hstatus.VUMT_MODE gives, not senvcfg.MT_MODE
    description: |-
      In HU-mode (hstatus.HU = 1; Zimt_H_checktag, needs Sv39) with two-stage translation and hstatus.SPVP = 0, and vsvittu putting the VITT range of VU-mode at the VS-stage user page without PTE.MTAG, which is not tag checked: hlv.d and hsv.d, through a pointer with a pointer tag, which hstatus.HUPMM masks, in the first page of the range with hstatus.VUMT_MODE set and senvcfg.MT_MODE = 00, then (with no VITT range in U-mode with Bare translation, SVATAG_NO_BARE_VITT_RANGE) with senvcfg.MT_MODE set and VUMT_MODE = 00. Record rd, and in HS-mode the check data that the accesses map. Each with 4-bit and 7-bit tags.
    expectation: With VUMT_MODE set, hlv.d raises a load access fault (cause 5) and hsv.d a store/AMO access fault (cause 7), stval = the masked access address, hstatus.GVA = 1, rd and memory unchanged; with senvcfg.MT_MODE set instead, both are performed.
    bins: 2 widths x (hlv.d, hsv.d) with VUMT_MODE set; 1 width without 7-bit tags
