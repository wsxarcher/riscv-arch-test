# Mapping of normative rules to coverpoints for the Svatag test suite
#
# Svatag_S runs in S-mode and U-mode, Svatag_H in HS-mode, VS-mode and VU-mode.

# Remove once Svatag's rules are tagged in its specification
untagged_upstream: Svatag (riscv/riscv-memory-tagging) has no normative rule tags yet

normative_rule_definitions:
  # svitts, svittu, vsvitts and vsvittu hold the tag table base of S/HS, U, VS and VU mode, which must be 4 KiB
  # aligned. The Zimt settag tests store tags in the tag table of each mode.
  - name: svatag_vitt
    coverpoint:
      [
        "{Svatag_S_cg, Svatag_H_cg}/cp_vitt_warl",
        "{Zimt_S_cg, Zimt_U_cg, Zimt_H_cg}/cp_settag_mt_enabled",
        "Zimt_H_cg/{cp_settag_two_stage, cp_settag_g_stage}",
      ]

  # A CSR access to svitts and svittu from VS-mode uses the state of vsvitts and vsvittu.
  - name: svatag_vitt_vs
    coverpoint: ["Svatag_H_cg/cp_vitt_vs_redirect"]

  # svitts and svittu are S-mode CSRs, vsvitts and vsvittu are hypervisor CSRs.
  - name: svatag_vitt_acc
    coverpoint: ["{Svatag_S_cg, Svatag_H_cg}/cp_vitt_access"]

  # With Smstateen, an access to svittu, svitts, vsvitts and vsvittu from a mode less privileged than M raises an
  # illegal instruction exception while mstateen0.MT = 0; with Ssstateen, one to svitts and svittu from VS-mode raises
  # a virtual instruction exception while hstateen0.MT = 0 and mstateen0.MT = 1, and with hstateen0.MT = 1 uses
  # vsvitts and vsvittu. The MT bit is not allocated yet: the tests use bit 53, the placeholder of the Sail model.
  # The tests run with M-mode (Zimt_Sm_stateen), which sets the bits: a certification without M-mode (EXCLUDE_SM) does
  # not cover the rule, nor does any test cover the case of Ssstateen without Smstateen.
  - name: svatag_stateen_mt
    coverpoint:
      [
        "Zimt_Sm_cg/{cp_mstateen0_mt_write, cp_hstateen0_mt_write, cp_hstateen0_mt_masked, cp_stateen_mt_m, cp_stateen_mt_m_level, cp_stateen_mt_forms, cp_stateen_mt_s_off, cp_stateen_mt_s_on, cp_stateen_mt_u, cp_stateen_mt_v_off, cp_stateen_mt_vs_h_off, cp_stateen_mt_vs_h_on, cp_stateen_mt_vs_hcsr, cp_stateen_mt_vu_on}",
      ]

  # HLV and HSV use vsvittu or vsvitts as the base of the tag table, as hstatus.SPVP = 0 or 1 selects. The Zimt HLV and
  # HSV tests use the table of the selected guest mode, and in cp_hlsv_checked that of the other one holds the opposite
  # tag.
  - name: svatag_vitt_hlsv
    coverpoint:
      [
        "Zimt_H_cg/{cp_hlsv_checked, cp_hlsv_paged, cp_vitt_hlsv, cp_vitt_hlsv_hu}",
      ]

  # With first-stage paging and memory tagging enabled, a regular access whose virtual addresses span the VITT range of
  # the effective privilege mode, mc_tag_va of its lowest to its highest virtual address, raises an access fault, and so
  # does a settag whose chunks overlap it. The tests take M-mode and Bare translation, whose range the specification
  # leaves implementation-defined, as having none, only for a config that declares it (SMVATAG_NO_M_MODE_VITT_RANGE,
  # SVATAG_NO_BARE_VITT_RANGE).
  - name: svatag_vitt_protection
    coverpoint:
      [
        "Zimt_S_cg/{cp_vitt, cp_vitt_settag_16, cp_vitt_mt_disabled, cp_vitt_gva}",
        "Zimt_Sm_cg/{cp_vitt_mprv_u, cp_vitt_mprv_v, cp_vitt_mtag_i, cp_vitt_mprv_u_gva, cp_vitt_mprv_v_gva}",
        "Zimt_U_cg/{cp_vitt_u, cp_vitt_u_gva}",
        "Zimt_H_cg/{cp_vitt_hlsv, cp_vitt_hlsv_hu, cp_vitt_hlvx, cp_vitt_v, cp_vitt_hlsv_gva, cp_vitt_hlsv_hu_gva, cp_vitt_v_gva}",
      ]

  # Svatag depends on Svukte and assumes the even split of the address space between user (the lower half) and
  # supervisor (the upper half) that Svukte enforces. Svukte qualifies the tag accesses of U-mode and VU-mode (also
  # through MPRV and HLV): with senvcfg.UKTE (hstatus.HUKTE for HLV in HU-mode), a tag table of U-mode or VU-mode in the
  # upper half raises page faults at the tag address. The framework rejects a config that implements Svatag but not
  # Svukte.
  - name: svatag_svukte
    coverpoint:
      [
        "Zimt_U_cg/cp_svukte_tag",
        "Zimt_Sm_cg/cp_svukte_tag_mprv",
        "Zimt_H_cg/{cp_svukte_tag_v, cp_svukte_tag_hu, cp_svukte_tag_hs}",
      ]
